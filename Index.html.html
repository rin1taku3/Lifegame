    else if (stage.group === "postgraduate") state.education.status = "postgraduate";
    else if (stage.group === "vocational") state.education.status = "university";
    else if (["preschool", "primary", "junior", "high", "zhongkao", "gaokao"].includes(stage.group)) state.education.status = stage.group;
  }

  function buildPostsecondaryTimeline(path, startAge = 18) {
    const rows = [];
    const addSemesters = (count, group, label) => {
      for (let i = 0; i < count; i += 1) {
        const ageStart = startAge + i * 0.5;
        rows.push({
          id: `${group}_${i + 1}`, name: `${label}${Math.floor(i / 2) + 1}年级${i % 2 === 0 ? "上" : "下"}`,
          group, ageStart, ageEnd: ageStart + 0.5, durationYears: 0.5, activities: 3, eventSlots: 1,
          educationFinal: i === count - 1,
        });
      }
      return startAge + count * 0.5;
    };
    let adultStart = startAge;
    if (path === "bachelor") adultStart = addSemesters(8, "university", "本科");
    else if (path === "long_bachelor") adultStart = addSemesters(10, "university", "长学制");
    else if (path === "vocational") adultStart = addSemesters(6, "vocational", "专科/高职");
    else if (path === "repeat") {
      rows.push({ id: "repeat_gaokao", name: "复读", group: "high", ageStart: 18, ageEnd: 19, durationYears: 1, activities: 3, eventSlots: 1, educationFinal: true });
      adultStart = 19;
    }
    rows.push(...buildAdultTimeline(adultStart));
    return rows;
  }

  function buildAdultTimeline(startAge) {
    const rows = [];
    for (let age = startAge; age < 35; age += 0.5) {
      const year = state.time.birthYear + Math.floor(age);
      rows.push({
        id: `adult_${String(age).replace(".", "_")}`,
        name: `${year}年${Number.isInteger(age) ? "上半年" : "下半年"}`,
        group: "adult", ageStart: age, ageEnd: age + 0.5, durationYears: 0.5, activities: 3, eventSlots: 1,
        finalAdultTurn: age >= 34.5,
      });
    }
    return rows;
  }

  function maybeInsertPostgraduate() {
    const stage = currentStage();
    if (!stage || !stage.educationFinal || stage.group !== "university" || hasFlag("postgraduate_decided")) return;
    addFlag("postgraduate_decided");
    const prep = state.education.postgradPrep + Number(state.counters.postgradPrep || 0) * 2;
    if (prep < 14) return;
    const success = withRng((rng) => rng.next() < clamp(0.2 + prep / 100 + state.education.gpa / 250, 0.2, 0.78));
    if (!success) {
      addFlag("postgrad_failed");
      return;
    }
    const nextIndex = state.currentStageIndex + 1;
    const startAge = Number(stage.ageEnd);
    const masterStages = [];
    for (let i = 0; i < 6; i += 1) {
      const ageStart = startAge + i * 0.5;
      masterStages.push({
        id: `postgraduate_${i + 1}`, name: `硕士${Math.floor(i / 2) + 1}年级${i % 2 === 0 ? "上" : "下"}`,
        group: "postgraduate", ageStart, ageEnd: ageStart + 0.5, durationYears: 0.5, activities: 3, eventSlots: 1,
        educationFinal: i === 5,
      });
    }
    const shift = 3;
    for (let i = nextIndex; i < state.timeline.length; i += 1) {
      const row = state.timeline[i];
      row.ageStart += shift;
      row.ageEnd += shift;
      if (row.group === "adult") row.name = `${state.time.birthYear + Math.floor(row.ageStart)}年${Number.isInteger(row.ageStart) ? "上半年" : "下半年"}`;
    }
    state.timeline.splice(nextIndex, 0, ...masterStages);
    state.education.degreeLevel = "硕士";
    addFlag("postgraduate_admitted");
  }

  function getVisibleSnapshot() {
    const career = state.career.careerName || (state.career.status === "not_started" ? "尚未就业" : state.career.status);
    return {
      age: state.time.age,
      year: state.time.year,
      stage: currentStage()?.name,
      score: round(state.stats.score),
      stress: round(state.stats.stress),
      mentalHealth: round(state.stats.mentalHealth),
      physicalHealth: round(state.stats.physicalHealth),
      economicCapital: round(state.stats.economicCapital),
      autonomy: round(state.stats.autonomy),
      career,
      annualIncome: round(state.career.annualIncome),
      cashRmb: round(state.finance.cashRmb),
      relationship: state.relationship.status,
      children: state.children.length,
    };
  }

  function snapshotPaths(paths) {
    const result = {};
    paths.forEach(([path, label]) => { result[path] = { label, value: Number(getPath(state, path, 0) || 0) }; });
    return result;
  }

  function compareSnapshots(before, after) {
    const rows = [];
    Object.keys(before).forEach((path) => {
      const a = before[path].value;
      const b = after[path].value;
      if (Math.abs(b - a) >= 0.4) rows.push({ path, label: before[path].label, before: a, after: b, delta: b - a });
    });
    return rows.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  }

  function stageMatchesActivity(activity, stage) {
    if (!stage) return false;
    const groups = activity.groups || [];
    if (groups.includes("all")) return true;
    if (groups.includes(stage.group)) return true;
    if (stage.group === "vocational" && groups.includes("university")) return true;
    if (["zhongkao", "gaokao"].includes(stage.group) && groups.some((g) => ["junior", "high"].includes(g))) return true;
    return false;
  }

  function availableActivities() {
    const stage = currentStage();
    if (!stage || stage.activities === 0) return [];
    let rows = DATA.activities.filter((activity) => stageMatchesActivity(activity, stage) && evaluateCondition(activity.eligibility));
    if (stage.group === "adult") {
      const priority = new Set(["A01", "A03", "A04", "A06", "A07", "A13", "A16", "A24", "A25", "A27", "A29", "A31", "A33", "A34", "A36", "A37", "A38", "A40"]);
      rows.sort((a, b) => Number(priority.has(b.id)) - Number(priority.has(a.id)) || a.id.localeCompare(b.id));
    }
    return rows;
  }

  function activityCategoryList() {
    const categories = [...new Set(availableActivities().map((item) => item.category || "其他"))];
    return ["全部", ...categories];
  }

  function selectedTimeCost() {
    return state.selectedActivities.reduce((sum, id) => {
      const activity = DATA.activities.find((item) => item.id === id);
      return sum + Number(activity?.timeCost || 1);
    }, 0);
  }

  function selectActivity(id) {
    if (state.phase !== "activity_selection") return;
    const activity = DATA.activities.find((item) => item.id === id);
    if (!activity || !currentStage()) return;
    state.selectedActivities = [id];
    saveState();
    render();
  }

  function removeSelectedActivity(index) {
    if (state.phase !== "activity_selection") return;
    state.selectedActivities = [];
    saveState();
    render();
  }

  function calculatePersonalEfficiency(activity) {
    const category = activity.category || "";
    let efficiency = 1;
    if (["学习", "学业", "升学", "科研", "门槛"].some((key) => category.includes(key))) {
      efficiency *= 0.75 + state.stats.learning / 250 + state.stats.discipline / 300;
    } else if (["技能", "就业", "成年", "高波动"].some((key) => category.includes(key))) {
      efficiency *= 0.78 + state.career.transferableSkill / 300 + state.stats.discipline / 350;
    } else if (["恢复", "健康"].some((key) => category.includes(key))) {
      efficiency *= 0.9 + (100 - state.stats.physicalHealth) / 350 + (100 - state.stats.stress) / 600;
    }
    if (state.stats.stress > 80) efficiency *= 0.75;
    else if (state.stats.stress > 65) efficiency *= 0.9;
    if (state.stats.physicalHealth < 35) efficiency *= 0.85;
    if (state.stats.mentalHealth < 30) efficiency *= 0.78;
    return clamp(efficiency, 0.45, 1.45);
  }

  function calculateFamilyMultiplier(activity) {
    const stage = currentStage();
    if (!stage || ["adult"].includes(stage.group)) return 1;
    const category = activity.category || "";
    if (category.includes("文化") || category.includes("履历") || activity.id === "E010") {
      return clamp(0.78 + state.family.culturalCapital / 180, 0.75, 1.35);
    }
    if (category.includes("教育消费") || category.includes("特长")) {
      return clamp(0.72 + state.family.wealth / 190, 0.7, 1.28);
    }
    if (category.includes("关系") || category.includes("机会")) {
      return clamp(0.82 + state.family.socialCapital / 220, 0.8, 1.25);
    }
    return clamp(0.86 + (state.family.stability + state.family.parentPresence) / 500, 0.8, 1.25);
  }

  function calculateInstitutionMultiplier(activity) {
    const stage = currentStage();
    if (!stage) return 1;
    if (["preschool", "primary", "junior", "high", "zhongkao", "gaokao"].includes(stage.group)) {
      const q = state.education.schoolQuality;
      let multiplier = 0.82 + q / 360;
      if (state.education.schoolType === "HS_B" && ["E018", "E019", "E021"].includes(activity.id)) multiplier += 0.12;
      if (state.education.schoolType === "HS_B" && ["E023", "E011", "E013"].includes(activity.id)) multiplier -= 0.08;
      return clamp(multiplier, 0.75, 1.25);
    }
    if (["university", "postgraduate", "vocational"].includes(stage.group)) {
      const tierBonus = { T0: 1.25, T1: 1.2, T2: 1.13, T3: 1.07, T4: 1.0, T5: 0.95 }[state.education.degreeTier] || 1;
      return tierBonus;
    }
    if (stage.group === "adult") {
      return clamp(0.85 + state.career.stability / 500 + state.region.job_opportunity / 600, 0.75, 1.25);
    }
    return 1;
  }

  function applyEffectOps(effectOps, multiplier = 1, sourceLabel = "", rng = null) {
    const localRng = rng || new SeededRng(state.rngState, true);
    const deltas = [];
    for (const op of effectOps || []) {
      const raw = resolveValueSpec(op.value, localRng);
      let value = raw;
      if (raw > 0) value *= multiplier;
      else if (raw < 0 && !op.target.includes("stress")) value *= Math.max(0.85, multiplier * 0.9);
      const result = addPath(state, op.target, value);
      if (op.target === "career.incomeIndex" && state.career.annualIncome > 0) {
        state.career.annualIncome = Math.max(0, state.career.annualIncome * (1 + value * 0.012));
      }
      if (op.target === "finance.cashIndex") {
        state.finance.cashRmb += value * 1800;
      }
      if (op.target === "finance.debtIndex") {
        state.finance.debtRmb = Math.max(0, state.finance.debtRmb + value * 2500);
      }
      deltas.push({ source: sourceLabel, target: op.target, label: op.label || op.target, value, before: result.before, after: result.after });
    }
    if (!rng) state.rngState = localRng.state;
    return deltas;
  }

  function runActivityActions(activity, rng) {
    for (const action of activity.actions || []) applyAction(action, rng);
    if (activity.id === "A24") {
      applyAction({ type: "partnerChance" }, rng);
    }
    if (activity.id === "A28") {
      state.relationship.pregnancyPossible = true;
    }
  }

  function resolveActivities() {
    const stage = currentStage();
    if (!stage) return;
    if (state.selectedActivities.length !== 1) {
      showToast("请先选择本次行动。", "warn");
      return;
    }
    const activity = DATA.activities.find((item) => item.id === state.selectedActivities[0]);
    if (!activity) return;
    const visibleBefore = getVisibleSnapshot();
    const before = snapshotPaths(CORE_STAT_PATHS);
    let detail = null;
    withRng((rng) => {
      const previous = (state.currentTurnRecord?.selectedActivities || []).filter(x => x.id === activity.id).length;
      const repeatMultiplier = DATA.gameConfig.repeatMultipliers[Math.min(previous, 2)] || 0.4;
      const multiplier = repeatMultiplier * calculatePersonalEfficiency(activity) * calculateFamilyMultiplier(activity) * calculateInstitutionMultiplier(activity) * rng.range(0.9, 1.1);
      const effects = applyEffectOps(activity.effectOps, multiplier, activity.name, rng);
      runActivityActions(activity, rng);
      detail = { id: activity.id, name: activity.name, category: activity.category, repeatIndex: previous, multiplier: round(multiplier, 2), effects };
    });
    normalizeState();
    const deltas = compareSnapshots(before, snapshotPaths(CORE_STAT_PATHS));
    lastTurnDeltas = deltas;
    if (!state.currentTurnRecord) {
      state.currentTurnRecord = { turn: state.time.turn, stageId: stage.id, stageName: stage.name, age: state.time.age, year: state.time.year, selectedActivities: [], events: [], passive: state.currentPassiveSummary || null, event: null, activityDeltas: [], snapshotBefore: visibleBefore };
    }
    state.currentTurnRecord.selectedActivities.push(detail);
    state.currentTurnRecord.activityDeltas.push(...deltas);
    state.actionStep = Number(state.actionStep || 0) + 1;
    state.lastActionFeedback = { name: activity.name, step: state.actionStep, deltas: deltas.slice(0,6) };
    state.selectedActivities = [];
    state.phase = "event_selection";
    prepareEventForCurrentAction(detail);
    saveState();
    render();
  }

  function normalizeState() {
    if (state.stats.stress > 80) {
      state.career.workPressure = clamp(state.career.workPressure + 1);
    }
    state.relationship.pregnancyPossible = state.relationship.status !== "single" && state.relationship.status !== "divorced" && state.children.length === 0 && state.time.age >= 22 && state.time.age <= 35;
    if (state.relationship.partner) {
      state.relationship.childIntentGap = Math.abs(Number(state.relationship.childIntent || 0) - Number(state.relationship.partner.childIntent || 0));
    }
    state.finance.debtIndex = clamp(state.finance.debtRmb / 10000 * 2.5 + state.finance.mortgageBalance / 100000 * 3);
    const monthly = Math.max(1500, state.finance.lastHalfExpense / 6 || 4000);
    state.finance.emergencyMonths = clamp(state.finance.cashRmb / monthly, 0, 60);
    state.finance.cashIndex = clamp(20 + Math.log10(Math.max(1, state.finance.cashRmb + 1000)) * 13);
    state.career.reemploymentResilience = clamp(
      state.career.transferableSkill * 0.32 + state.career.experienceMonths / 6 * 1.2 + state.stats.socialCapital * 0.16 +
      state.region.job_opportunity * 0.12 + state.stats.physicalHealth * 0.08 + state.finance.emergencyMonths * 0.8 -
      state.finance.debtIndex * 0.12 - state.care.parentCareBurden * 0.08 - state.care.childcareBurden * 0.08
    );
    state.stats.satisfaction = clamp(
      45 + state.stats.autonomy * 0.22 + state.stats.mentalHealth * 0.2 + state.relationship.quality * 0.1 +
      state.finance.emergencyMonths * 0.6 - state.stats.stress * 0.22 - state.care.parentCareBurden * 0.08
    );
  }

  function calculateFamilySupport() {
    return clamp(
      state.stats.economicCapital * 0.3 + state.stats.culturalCapital * 0.3 + state.family.parentPresence * 0.18 + state.family.stability * 0.22
    );
  }

  function calculateZhongkaoStrength() {
    return withRng((rng) => {
      const familySupport = calculateFamilySupport();
      const luck = rng.range(-8, 8);
      const pressurePenalty = state.stats.stress <= 60 ? 0 : clamp((state.stats.stress - 60) * 0.25, 0, 10);
      const competitionPenalty = clamp((state.region.exam_competition - 65) * 0.18, 0, 8);
      const policy = state.education.indicatorPolicy ? rng.range(1, 7) : 0;
      const value = state.stats.score * 0.45 + state.stats.learning * 0.15 + state.stats.discipline * 0.10 +
        state.education.schoolQuality * 0.10 + familySupport * 0.06 + state.stats.mentalHealth * 0.05 +
        state.stats.physicalHealth * 0.03 + state.stats.infoSensitivity * 0.03 + luck - pressurePenalty - competitionPenalty + policy;
      state.education.zhongkaoStrength = clamp(value);
      state.milestones.zhongkaoCalculation = { value: round(state.education.zhongkaoStrength, 1), luck: round(luck, 1), pressurePenalty: round(pressurePenalty, 1), competitionPenalty: round(competitionPenalty, 1), policy: round(policy, 1) };
      return state.education.zhongkaoStrength;
    });
  }

  function calculateGaokaoStrength() {
    return withRng((rng) => {
      const familySupport = calculateFamilySupport();
      const luck = rng.range(-10, 10);
      const pressurePenalty = state.stats.stress <= 60 ? 0 : clamp((state.stats.stress - 60) * 0.3, 0, 12);
      const competitionPenalty = clamp((state.region.exam_competition - 60) * 0.24, 0, 10);
      const policy = state.person.policyQualification ? rng.range(0, 8) : 0;
      const value = state.stats.score * 0.42 + state.stats.learning * 0.14 + state.stats.discipline * 0.10 +
        state.education.schoolQuality * 0.12 + state.stats.mentalHealth * 0.05 + state.stats.physicalHealth * 0.03 +
        familySupport * 0.05 + state.education.applicationInfo * 0.04 + state.stats.reputation * 0.03 + luck - pressurePenalty - competitionPenalty + policy;
      state.education.gaokaoStrength = clamp(value);
      state.milestones.gaokaoCalculation = { value: round(state.education.gaokaoStrength, 1), luck: round(luck, 1), pressurePenalty: round(pressurePenalty, 1), competitionPenalty: round(competitionPenalty, 1), policy: round(policy, 1) };
      return state.education.gaokaoStrength;
    });
  }

  function generatedEvent(id, title, text, choices, type = "关键节点") {
    return { id, title, text, type, generated: true, choices, sensitivity: "普通" };
  }

  function makeZhongkaoApplicationEvent() {
    const strength = calculateZhongkaoStrength();
    const choices = [
      { code: "A", text: "冲刺更高档次高中", effectOps: [], actions: [{ type: "set", path: "education.zhongkaoStrategy", value: "aggressive" }], delayedText: "上限提高，滑档风险同步上升。" },
      { code: "B", text: "按梯度稳妥填报", effectOps: [], actions: [{ type: "set", path: "education.zhongkaoStrategy", value: "balanced" }], delayedText: "降低滑档风险，也可能放弃一次冲高机会。" },
      { code: "C", text: "优先考虑优质职校或职普融通", effectOps: [], actions: [{ type: "set", path: "education.zhongkaoStrategy", value: "vocational" }], delayedText: "技能路线提前开启，学历标签和专业质量会成为新变量。" },
    ];
    if (state.family.wealth >= 45) {
      choices.push({ code: "D", text: "用民办高中作为付费托底", effectOps: [{ label: "经济资本", target: "stats.economicCapital", operator: "add", value: { mode: "fixed", value: -10 } }], actions: [{ type: "set", path: "education.zhongkaoStrategy", value: "private_backup" }], delayedText: "录取稳定上升，家庭现金流和学校质量仍需检定。" });
    }
    return generatedEvent(
      "GEN_ZHONGKAO_APPLICATION",
      "中考志愿填报",
      `估算中考实力为 ${round(strength, 1)}。地区竞争系数为 ${state.region.exam_competition}/100。家庭能提供的并非分数，而是信息、民办费用、陪读和承受失误的能力。`,
      choices
    );
  }

  function determineHighSchoolOptions() {
    const s = state.education.zhongkaoStrength || calculateZhongkaoStrength();
    const strategy = state.education.zhongkaoStrategy || "balanced";
    const roll = withRng((rng) => rng.range(-5, 5));
    let adjusted = s + roll;
    if (strategy === "aggressive") adjusted += 1;
    if (strategy === "balanced") adjusted += 2;
    if (strategy === "vocational") adjusted -= 8;
    const candidates = [];
    if (strategy === "vocational") {
      candidates.push({ code: "A", schoolType: "HS_E", track: "vocational", text: "进入本地较好的职业高中/中专专业", quality: 54, cost: 0 });
      if (s >= 58) candidates.push({ code: "B", schoolType: "HS_C", track: "general", text: "转向普通高中，继续准备高考", quality: 60, cost: 3 });
    } else {
      let primary = "HS_E";
      if (adjusted >= 92) primary = "HS_S";
      else if (adjusted >= 82) primary = state.person.regionGroup === "county" ? "HS_B" : "HS_A";
      else if (adjusted >= 69) primary = state.person.regionGroup === "county" ? "HS_B" : "HS_C";
      else if (adjusted >= 56) primary = "HS_C";
      else if (adjusted >= 44) primary = state.family.wealth >= 48 ? "HS_D" : "HS_E";
      candidates.push({ code: "A", schoolType: primary, track: primary === "HS_E" ? "vocational" : "general", text: `接受${schoolTypeName(primary)}的录取`, quality: { HS_S: 92, HS_A: 82, HS_B: 78, HS_C: 62, HS_D: 57, HS_E: 50 }[primary], cost: primary === "HS_D" ? 10 : 0 });
      if (primary !== "HS_E") candidates.push({ code: "B", schoolType: "HS_C", track: "general", text: "选择压力较低、距离较近的普通高中", quality: 62, cost: 0 });
      candidates.push({ code: "C", schoolType: "HS_E", track: "vocational", text: "选择产业适配更好的职校专业", quality: 52, cost: 0 });
      if (state.family.wealth >= 50 && primary !== "HS_S") candidates.push({ code: "D", schoolType: "HS_D", track: "general", text: "支付更高费用进入民办高中", quality: 60, cost: 12 });
    }
    return candidates.slice(0, 4);
  }

  function makeZhongkaoAdmissionEvent() {
    const options = determineHighSchoolOptions();
    return generatedEvent(
      "GEN_ZHONGKAO_ADMISSION",
      "中考录取结果",
      "分数完成了筛选，家庭开始处理筛选之后的成本。高中类型会改变成绩增长、压力、文化机会和未来志愿信息。",
      options.map((option) => ({
        code: option.code,
        text: option.text,
        effectOps: option.cost ? [{ label: "经济资本", target: "stats.economicCapital", operator: "add", value: { mode: "fixed", value: -option.cost } }] : [],
        actions: [{ type: "chooseHighSchool", schoolType: option.schoolType, track: option.track, quality: option.quality }],
        delayedText: option.schoolType === "HS_B" ? "应试收益高，身体和心理压力也会增加。" : option.schoolType === "HS_E" ? "技能路线与学历天花板同时出现。" : "学校资源和个体适配将在高中阶段继续分化。",
      }))
    );
  }

  function makeGaokaoApplicationEvent() {
    const strength = calculateGaokaoStrength();
    return generatedEvent(
      "GEN_GAOKAO_APPLICATION",
      "高考志愿填报",
      `估算高考实力为 ${round(strength, 1)}。学校、专业、城市、学费和调剂风险无法同时达到最优，志愿表只是把这些冲突排出顺序。`,
      [
        { code: "A", text: "学校层次优先，接受专业调剂", effectOps: [], actions: [{ type: "set", path: "education.gaokaoStrategy", value: "school_first" }], delayedText: "学校名望提高，专业匹配可能下降。" },
        { code: "B", text: "专业匹配优先，适当降低学校层次", effectOps: [], actions: [{ type: "set", path: "education.gaokaoStrategy", value: "major_first" }], delayedText: "技能路径更清晰，学校默认信任可能减少。" },
        { code: "C", text: "城市与就业机会优先", effectOps: [], actions: [{ type: "set", path: "education.gaokaoStrategy", value: "city_first" }], delayedText: "实习和工作机会增加，生活成本更高。" },
        { code: "D", text: "低成本与稳定路径优先", effectOps: [], actions: [{ type: "set", path: "education.gaokaoStrategy", value: "stability_first" }], delayedText: "财务压力下降，地域或服务期可能形成约束。" },
      ]
    );
  }

  function tierFromStrength(strength) {
    if (strength >= 96) return "T0";
    if (strength >= 90) return "T1";
    if (strength >= 82) return "T2";
    if (strength >= 70) return "T3";
    if (strength >= 56) return "T4";
    if (strength >= 42) return "T5";
    return "T6_NONE";
  }

  function tierRank(tier) {
    return { T0: 0, T1: 1, T2: 2, T3: 3, T4: 4, T5: 5, T6_NONE: 6 }[tier] ?? 6;
  }

  function tierAtOffset(tier, offset) {
    const tiers = ["T0", "T1", "T2", "T3", "T4", "T5", "T6_NONE"];
    return tiers[clamp(tierRank(tier) + offset, 0, tiers.length - 1)];
  }

  function tierName(tier) {
    return {
      T0: "顶级大学", T1: "强985/顶尖行业院校", T2: "211/双一流/强行业院校", T3: "强省属本科/强双非",
      T4: "普通本科/民办本科", T5: "高职专科/职业本科", T6_NONE: "未进入高等教育",
    }[tier] || tier;
  }

  function chooseMajorCandidates(baseTier, strategy) {
    return withRng((rng) => {
      let pool = DATA.majorArchetypes.slice();
      const vocational = baseTier === "T5" || state.education.track === "vocational";
      if (vocational) pool = pool.filter((m) => ["vocational", "engineering", "medical", "accounting"].includes(m.category));
      const preferences = [];
      if (state.stats.digitalSkill >= 45 || state.counters.interestTech >= 2) preferences.push("computing", "engineering");
      if (state.stats.culturalCapital >= 65) preferences.push("humanities", "law", "education", "arts");
      if (state.stats.vocationalSkill >= 55) preferences.push("vocational", "engineering");
      if (state.stats.systemAdaptation >= 62) preferences.push("education", "law", "accounting", "medical");
      const scoreMajor = (m) => {
        let score = rng.range(0, 20);
        if (preferences.includes(m.category)) score += 20;
        if (strategy === "major_first") score += 12;
        if (strategy === "stability_first" && ["education", "medical", "accounting", "engineering"].includes(m.category)) score += 10;
        if (strategy === "city_first" && ["computing", "business", "arts", "humanities"].includes(m.category)) score += 8;
        if (state.family.wealth < 35) score -= m.cost * 0.16;
        return score;
      };
      return pool.sort((a, b) => scoreMajor(b) - scoreMajor(a)).slice(0, 5);
    });
  }

  function makeGaokaoOffers() {
    const strength = state.education.gaokaoStrength || calculateGaokaoStrength();
    const baseTier = tierFromStrength(strength);
    const strategy = state.education.gaokaoStrategy || "major_first";
    if (baseTier === "T6_NONE") {
      return [
        { code: "A", text: "复读一年，再参加高考", tier: "T6_NONE", path: "repeat", major: null, fit: 45, cost: 5, away: false },
        { code: "B", text: "进入本地高职/职业本科", tier: "T5", path: "vocational", major: DATA.majorArchetypes.find((m) => m.id === "M13"), fit: 70, cost: 2, away: false },
        { code: "C", text: "直接进入就业市场", tier: "T6_NONE", path: "direct_work", major: null, fit: 50, cost: 0, away: false },
      ];
    }
    const majors = chooseMajorCandidates(baseTier, strategy);
    const highestMajor = majors[0];
    const balancedMajor = majors[1] || majors[0];
    const stableMajor = majors.find((m) => ["education", "medical", "accounting", "engineering", "vocational"].includes(m.category)) || majors[2] || majors[0];
    const highestTier = strategy === "school_first" ? baseTier : tierAtOffset(baseTier, 0);
    const balancedTier = strategy === "major_first" ? tierAtOffset(baseTier, 1) : baseTier;
    const stableTier = tierAtOffset(baseTier, baseTier === "T5" ? 0 : 1);
    return [
      { code: "A", text: `${tierName(highestTier)}，${strategy === "school_first" ? "接受调剂后的" : "竞争较强的"}${highestMajor.name}`, tier: highestTier, path: highestTier === "T5" ? "vocational" : (highestMajor.category === "medical" ? "long_bachelor" : "bachelor"), major: highestMajor, fit: strategy === "school_first" ? 48 : 62, cost: state.region.housing_cost > 75 ? 8 : 5, away: true },
      { code: "B", text: `${tierName(balancedTier)}，专业匹配较高的${balancedMajor.name}`, tier: balancedTier, path: balancedTier === "T5" ? "vocational" : (balancedMajor.category === "medical" ? "long_bachelor" : "bachelor"), major: balancedMajor, fit: 78, cost: 4, away: true },
      { code: "C", text: `${tierName(stableTier)}，低成本或稳定导向的${stableMajor.name}`, tier: stableTier, path: stableTier === "T5" ? "vocational" : (stableMajor.category === "medical" ? "long_bachelor" : "bachelor"), major: stableMajor, fit: 72, cost: 1, away: false },
    ];
  }

  function makeGaokaoAdmissionEvent() {
    const offers = makeGaokaoOffers();
    return generatedEvent(
      "GEN_GAOKAO_ADMISSION",
      "高考录取与专业选择",
      "录取通知书会写学校和专业，不会替你写清楚城市成本、行业周期、家庭支持年限和毕业时的就业市场。请选择一条路径。",
      offers.map((offer) => ({
        code: offer.code,
        text: offer.text,
        effectOps: offer.cost ? [{ label: "经济资本", target: "stats.economicCapital", operator: "add", value: { mode: "fixed", value: -offer.cost } }] : [],
        actions: [{ type: "chooseEducationOffer", offer }],
        delayedText: offer.path === "direct_work" ? "工作经验提前积累，学历门槛同时固定下来。" : offer.path === "repeat" ? "年龄、金钱和心理成本增加，下一次结果仍不保证。" : "学校、专业、城市和家庭资源将在大学阶段继续交换。",
      }))
    );
  }

  function makeEmploymentOfferEvent() {
    const options = careerOptionsForState(3);
    return generatedEvent(
      "GEN_EMPLOYMENT_OFFERS",
      "第一份主要职业路径",
      "毕业证只证明你完成了一段教育。岗位开始重新计算学校、专业、技能、实习、城市和关系网络的组合。",
      options.map((career, index) => ({
        code: String.fromCharCode(65 + index),
        text: `${career.name}｜起薪约${formatMoney(career.offerIncome)}｜稳定${career.stability}/100｜年龄风险${career.age_risk}/100`,
        effectOps: [],
        actions: [{ type: "chooseCareer", careerId: career.id, offerIncome: career.offerIncome }],
        delayedText: career.note,
      }))
    );
  }

  function careerOptionsForState(count = 3) {
    return withRng((rng) => {
      const major = DATA.majorArchetypes.find((m) => m.id === state.education.majorId);
      const preferredIds = new Set(major?.careerIds || []);
      if (state.career.civilExamPrep >= 8) ["C11", "C12", "C13"].forEach((id) => preferredIds.add(id));
      if (state.stats.vocationalSkill >= 60) ["C21", "C23", "C25"].forEach((id) => preferredIds.add(id));
      if (state.career.aiSkill >= 50) ["C01", "C03"].forEach((id) => preferredIds.add(id));
      const tierScore = Math.max(0, 6 - tierRank(state.education.degreeTier || "T5"));
      const scored = DATA.careers.map((career) => {
        const [minIncome, maxIncome] = parseBand(career.start_band);
        let score = rng.range(0, 18) + state.career.transferableSkill * 0.18 + state.stats.socialCapital * 0.08 + state.region.job_opportunity * 0.08;
        if (preferredIds.has(career.id)) score += 32;
        if (career.school_dep > 70) score += tierScore * 4 - (state.education.degreeTier === "T4" || state.education.degreeTier === "T5" ? 15 : 0);
        if (career.city_dep > state.region.job_opportunity + 15) score -= 8;
        if (state.person.gender === "female" && career.maternity_penalty > 70) score -= 2;
        if (state.education.degreeLevel == null && ["C05", "C15", "C18", "C28"].includes(career.id)) score -= 35;
        const offerFactor = clamp(0.35 + state.career.transferableSkill / 180 + tierScore * 0.045 + state.region.job_opportunity / 300, 0.45, 1.05);
        const offerIncome = minIncome + (maxIncome - minIncome) * clamp(offerFactor + rng.range(-0.08, 0.08), 0.15, 0.95);
        return { ...career, score, offerIncome: Math.round(offerIncome / 1000) * 1000 };
      });
      return scored.sort((a, b) => b.score - a.score).slice(0, count);
    });
  }

  function eventMatchesStage(event, stage) {
    if (!stage) return false;
    const groups = event.stageGroups || [];
    if (groups.includes(stage.group)) return true;
    if (groups.includes("school") && ["preschool", "primary", "junior", "high", "zhongkao", "gaokao"].includes(stage.group)) return true;
    if (stage.group === "vocational" && groups.includes("university")) return true;
    if (stage.group === "adult" && groups.includes("ending") && stage.finalAdultTurn) return true;
    return false;
  }

  function eventEligible(event, relax = false) {
    const stage = currentStage();
    if (!eventMatchesStage(event, stage)) return false;
    const age = state.time.age;
    if (age < event.ageMin || age > event.ageMax) return false;
    if (!stage.finalAdultTurn && event.stageGroups.includes("ending")) return false;
    const lastTurn = state.cooldowns[event.id];
    if (lastTurn != null && state.time.turn - lastTurn < Number(event.cooldownTurns || 0)) return false;
    if (!relax && !evaluateCondition(event.eligibility)) return false;
    return true;
  }

  function eventWeight(event) {
    let weight = Number(event.baseWeight || 1);
    for (const modifier of event.weightModifiers || []) {
      if (evaluateCondition(modifier.when)) weight *= Number(modifier.multiplier || 1);
    }
    if (event.id === "EV089") weight *= 0.28;
    if (event.id === "EV070") weight *= 0.45;
    if (event.id === "EV058") weight *= clamp(0.4 + state.career.layoffExposure / 80, 0.35, 1.7);
    if (event.id === "EV063") weight *= clamp(0.5 + state.career.aiSkill / 80, 0.4, 1.7);
    if (event.id === "EV012" || event.id === "EV038") weight *= clamp(0.65 + state.stats.infoSensitivity / 120, 0.6, 1.5);
    return weight;
  }

  function drawRegularEvent() {
    const scheduledIndex = state.scheduledEvents.findIndex((item) => item.dueTurn <= state.time.turn);
    if (scheduledIndex >= 0) {
      const scheduled = state.scheduledEvents.splice(scheduledIndex, 1)[0];
      const found = DATA.events.find((item) => item.id === scheduled.eventId);
      if (found) return deepClone(found);
    }
    let candidates = DATA.events.filter((event) => eventEligible(event, false));
    if (!candidates.length) candidates = DATA.events.filter((event) => eventEligible(event, true));
    if (!candidates.length) return makeFallbackEvent();
    return withRng((rng) => deepClone(rng.weighted(candidates, eventWeight)));
  }

  function makeFallbackEvent() {
    return generatedEvent(
      `GEN_ORDINARY_${state.time.turn}`,
      "没有发生足以被写进简历的事",
      "生活仍然消耗了房租、睡眠、注意力和关系。没有重大事件并不等于没有结构性变化。",
      [
        { code: "A", text: "维持当前节奏", effectOps: [{ label: "稳定", target: currentStage().group === "adult" ? "career.stability" : "education.continuity", operator: "add", value: { mode: "fixed", value: 1 } }], actions: [], delayedText: "变化较小。" },
        { code: "B", text: "主动复盘并调整下一回合", effectOps: [{ label: "信息敏感度", target: "stats.infoSensitivity", operator: "add", value: { mode: "fixed", value: 2 } }, { label: "压力", target: "stats.stress", operator: "add", value: { mode: "fixed", value: 1 } }], actions: [], delayedText: "看清问题也需要时间。" },
      ]
    );
  }

  function makeActionContextEvent(activity) {
    const age = state.time.age;
    const cat = activity?.category || "日常";
    if (["关系", "社交", "恋爱", "家庭"].some(k => cat.includes(k)) || ["E015","E026","U10","A24"].includes(activity?.id)) {
      const title = age < 18 ? "课间里没有写进成绩单的关系" : "一次需要回应的靠近";
      const text = age < 18 ? "活动结束后，一位同学开始更频繁地等你一起走。班里有人起哄，老师也似乎注意到了。关系本身没有标准答案，周围的人却很快替它命名。" : "你和对方的相处开始越过礼貌边界。工作、城市、房租和未来安排让这段靠近很快具有现实重量。";
      return generatedEvent(`GEN_SOCIAL_${state.time.turn}_${state.actionStep}`, title, text, [
        { code:"A", text:"坦率回应，继续了解", effectOps:[{label:"同伴/关系",target: age<18?"stats.peerRelationship":"relationship.quality",operator:"add",value:{mode:"fixed",value:4}},{label:"压力",target:"stats.stress",operator:"add",value:{mode:"fixed",value:2}}], actions: age>=18?[{type:"partnerChance"}]:[], delayedText:"亲密会带来支持，也会占用时间并暴露差异。" },
        { code:"B", text:"保持边界，把注意力留给当前目标", effectOps:[{label:"自律",target:"stats.discipline",operator:"add",value:{mode:"fixed",value:2}},{label:"同伴关系",target:"stats.peerRelationship",operator:"add",value:{mode:"fixed",value:-2}}], actions:[], delayedText:"边界更清楚，对方可能理解，也可能逐渐疏远。" },
        { code:"C", text:"先和可信任的人谈谈", effectOps:[{label:"信息敏感度",target:"stats.infoSensitivity",operator:"add",value:{mode:"fixed",value:2}},{label:"心理健康",target:"stats.mentalHealth",operator:"add",value:{mode:"fixed",value:2}}], actions:[], delayedText:"关系被放回更大的生活背景里。" }
      ], "行动衍生·人际");
    }
    if (["学习","学业","升学","文化","科研"].some(k => cat.includes(k))) {
      return generatedEvent(`GEN_STUDY_${state.time.turn}_${state.actionStep}`, "老师在作业本上多写了一行字", "这次行动之后，老师注意到了你的变化。他愿意给你一次额外机会，但也意味着更高期待和更多公开比较。", [
        {code:"A",text:"接下额外任务",effectOps:[{label:"成绩",target:"stats.score",operator:"add",value:{mode:"fixed",value:3}},{label:"名望",target:"stats.reputation",operator:"add",value:{mode:"fixed",value:2}},{label:"压力",target:"stats.stress",operator:"add",value:{mode:"fixed",value:3}}],actions:[],delayedText:"获得关注，也进入更严格的评价。"},
        {code:"B",text:"只请老师指出最关键的问题",effectOps:[{label:"学习能力",target:"stats.learning",operator:"add",value:{mode:"fixed",value:2}},{label:"信息敏感度",target:"stats.infoSensitivity",operator:"add",value:{mode:"fixed",value:1}}],actions:[],delayedText:"收益较稳，曝光较少。"},
        {code:"C",text:"婉拒，先恢复状态",effectOps:[{label:"压力",target:"stats.stress",operator:"add",value:{mode:"fixed",value:-3}},{label:"心理健康",target:"stats.mentalHealth",operator:"add",value:{mode:"fixed",value:2}}],actions:[],delayedText:"你放弃了一次机会，也保住了部分余量。"}
      ], "行动衍生·学校");
    }
    if (["成年","就业","技能","高波动"].some(k => cat.includes(k))) {
      return generatedEvent(`GEN_WORK_${state.time.turn}_${state.actionStep}`, "临时任务被放到你的桌上", "上级说这是一次锻炼机会。任务边界含糊，截止时间明确，完成后是否被看见仍然未知。", [
        {code:"A",text:"接下并争取署名",effectOps:[{label:"技能",target:"career.transferableSkill",operator:"add",value:{mode:"fixed",value:3}},{label:"绩效",target:"career.performance",operator:"add",value:{mode:"fixed",value:3}},{label:"压力",target:"stats.stress",operator:"add",value:{mode:"fixed",value:4}}],actions:[],delayedText:"承担更多，可能获得更多，也可能只留下更多工作。"},
        {code:"B",text:"先确认资源、权限和回报",effectOps:[{label:"劳动权益",target:"career.laborRightsKnowledge",operator:"add",value:{mode:"fixed",value:3}},{label:"社会资本",target:"stats.socialCapital",operator:"add",value:{mode:"fixed",value:1}}],actions:[],delayedText:"边界更清晰，也可能被评价为不够好用。"},
        {code:"C",text:"拒绝，把精力留给原工作",effectOps:[{label:"自主",target:"stats.autonomy",operator:"add",value:{mode:"fixed",value:2}},{label:"职业稳定",target:"career.stability",operator:"add",value:{mode:"fixed",value:-1}}],actions:[],delayedText:"少了一次曝光，也避免了承诺失控。"}
      ], "行动衍生·职场");
    }
    return null;
  }

  function prepareEventForCurrentAction(activity) {
    const stage = currentStage();
    const isLast = state.actionStep >= 3;
    if (isLast && stage.special === "zhongkao_application") state.pendingEvent = makeZhongkaoApplicationEvent();
    else if (isLast && stage.special === "gaokao_application") state.pendingEvent = makeGaokaoApplicationEvent();
    else if (isLast && stage.finalAdultTurn) prepareEventForCurrentTurn();
    else {
      const contextual = makeActionContextEvent(activity);
      state.pendingEvent = withRng(rng => (contextual && rng.next() < 0.68) ? contextual : drawRegularEvent());
    }
  }

  function prepareEventForCurrentTurn() {
    const stage = currentStage();
    if (!stage) return;
    if (stage.special === "zhongkao_application") state.pendingEvent = makeZhongkaoApplicationEvent();
    else if (stage.special === "zhongkao_admission") state.pendingEvent = makeZhongkaoAdmissionEvent();
    else if (stage.special === "gaokao_application") state.pendingEvent = makeGaokaoApplicationEvent();
    else if (stage.special === "gaokao_admission") state.pendingEvent = makeGaokaoAdmissionEvent();
    else if (stage.finalAdultTurn) {
      const careerEvent = HIGH_RISK_CAREERS.has(state.career.careerId) || state.career.ageRiskBase >= 55 ? "EV096" : "EV097";
      const familyEvent = state.care.parentCareBurden >= 45 ? "EV099" : state.children.length === 0 ? "EV098" : null;
      state.eventQueue = [careerEvent, ...(familyEvent ? [familyEvent] : []), "EV100"];
      const firstEventId = state.eventQueue.shift();
      const firstEvent = DATA.events.find((event) => event.id === firstEventId);
      state.pendingEvent = firstEvent ? deepClone(firstEvent) : makeFallbackEvent();
    } else {
      state.pendingEvent = drawRegularEvent();
    }
  }

  function applyAction(action, rng) {
    if (!action || !action.type) return;
    switch (action.type) {
      case "set": setPath(state, action.path, deepClone(action.value)); break;
      case "add": addPath(state, action.path, Number(action.value || 0)); break;
      case "addFlag": addFlag(action.value); break;
      case "removeFlag": removeFlag(action.value); break;
      case "schedule": {
        const delay = Array.isArray(action.delayTurns) ? rng.int(action.delayTurns[0], action.delayTurns[1]) : Number(action.delayTurns || 1);
        state.scheduledEvents.push({ eventId: action.eventId, dueTurn: state.time.turn + delay });
        break;
      }
      case "scheduleAction": state.scheduledActions.push({ action: deepClone(action.action), dueTurn: state.time.turn + Number(action.delayTurns || 1) }); break;
      case "chooseHighSchool": chooseHighSchool(action); break;
      case "chooseEducationOffer": chooseEducationOffer(action.offer); break;
      case "chooseCareer": chooseCareer(action.careerId, action.offerIncome); break;
      case "setCareer": chooseCareer(action.careerId, undefined, action.orgType); break;
      case "careerMove": performCareerMove(action.mode, rng); break;
      case "moveRegion": performMove(action.mode, rng); break;
      case "createPartner": createPartner(rng, action.source, action.status); break;
      case "partnerChance": maybeCreatePartner(rng); break;
      case "addChild": addChild(Number(action.age || 0), rng); break;
      case "buildEmergencyFund": buildEmergencyFund(); break;
      case "buyHouse": buyHouse(rng); break;
      case "repayMortgage": repayMortgage(); break;
      default: break;
    }
  }

  function chooseHighSchool(action) {
    state.education.schoolType = action.schoolType;
    state.education.track = action.track;
    state.education.schoolQuality = clamp(action.quality);
    state.milestones.zhongkao = {
      strength: round(state.education.zhongkaoStrength, 1), strategy: state.education.zhongkaoStrategy,
      schoolType: action.schoolType, schoolName: schoolTypeName(action.schoolType), track: action.track,
    };
    if (action.schoolType === "HS_S") state.stats.stress = clamp(state.stats.stress + 10);
    if (action.schoolType === "HS_B") {
      state.stats.stress = clamp(state.stats.stress + 12);
      state.stats.discipline = clamp(state.stats.discipline + 4);
    }
    if (action.schoolType === "HS_E") {
      state.stats.vocationalSkill = clamp(state.stats.vocationalSkill + 10);
      state.education.track = "vocational";
    }
  }

  function chooseEducationOffer(offer) {
    state.education.degreeTier = offer.tier;
    state.education.majorId = offer.major?.id || null;
    state.education.majorName = offer.major?.name || null;
    state.education.majorCategory = offer.major?.category || null;
    state.education.majorFit = Number(offer.fit || 50);
    state.education.awayFromHome = Boolean(offer.away);
    state.education.degreeLevel = offer.path === "direct_work" ? null : offer.path === "vocational" ? "专科/高职" : "本科";
    state.education.track = offer.path === "vocational" ? "college_vocational" : offer.path;
    state.milestones.gaokao = {
      strength: round(state.education.gaokaoStrength, 1), strategy: state.education.gaokaoStrategy,
      tier: offer.tier, tierName: tierName(offer.tier), path: offer.path, majorId: offer.major?.id || null, majorName: offer.major?.name || null,
    };
    if (offer.path === "direct_work") addFlag("direct_work_after_high_school");
    if (offer.path === "repeat") addFlag("repeat_gaokao");
    const appendRows = buildPostsecondaryTimeline(offer.path, 18);
    state.timeline.splice(state.currentStageIndex + 1, state.timeline.length - state.currentStageIndex - 1, ...appendRows);
  }

  function chooseCareer(careerId, offerIncome, forcedOrgType) {
    const career = DATA.careers.find((item) => item.id === careerId);
    if (!career) return;
    const [minIncome, maxIncome] = parseBand(career.start_band);
    const income = Number(offerIncome || ((minIncome + maxIncome) / 2));
    state.career.status = career.id === "C26" ? "entrepreneur" : career.id === "C24" || career.id === "C31" ? "flexible" : "employed";
    state.career.careerId = career.id;
    state.career.careerName = career.name;
    state.career.industry = career.industry;
    state.career.orgType = forcedOrgType || (PUBLIC_CAREERS.has(career.id) ? "public" : career.id === "C24" ? "platform" : career.id === "C26" ? "small_business" : career.id === "C31" ? "freelance" : "private");
    state.career.contractType = state.career.orgType === "public" ? "formal" : "none";
    state.career.annualIncome = Math.round(income);
    state.career.incomeIndex = clamp(30 + income / 6000);
    state.career.stability = Number(career.stability || 50);
    state.career.transferableSkill = clamp(Math.max(state.career.transferableSkill, Number(career.skill_port || 50) * 0.55 + state.stats.vocationalSkill * 0.25));
    state.career.ageRiskBase = Number(career.age_risk || 40);
    state.career.layoffExposure = clamp(career.age_risk * 0.45 + (100 - career.stability) * 0.35 + state.world.scenario.layoff_risk * 10);
    state.career.workPressure = Number(career.pressure || 50);
    state.career.companyRisk = clamp((100 - career.stability) * 0.62 + withRng((rng) => rng.range(8, 28)));
    state.career.ceilingIndex = clamp(35 + Number(career.skill_port || 50) * 0.35 + (maxIncome / 10000) * 1.2);
    state.career.opportunityIndex = clamp(state.region.job_opportunity * 0.6 + state.stats.socialCapital * 0.18 + state.career.transferableSkill * 0.22);
    state.career.remoteEligible = REMOTE_CAREERS.has(career.id);
    state.career.aiSubstitutionExposure = ["C02", "C06", "C07", "C08", "C09", "C12", "C14", "C22", "C30", "C31"].includes(career.id) ? 65 : ["C01", "C03", "C18"].includes(career.id) ? 48 : 28;
    state.career.credentialNeed = ["C06", "C13", "C15", "C16", "C17", "C18"].includes(career.id) ? 75 : 30;
    state.finance.socialProtection = state.career.orgType === "public" ? 85 : state.career.orgType === "private" ? 62 : 30;
    state.milestones.firstCareer = { careerId: career.id, careerName: career.name, annualIncome: state.career.annualIncome, age: state.time.age };
  }

  function performCareerMove(mode, rng) {
    if (!state.career.careerId) return;
    const options = careerOptionsForState(5).filter((item) => item.id !== state.career.careerId);
    const target = options[0] || DATA.careers.find((item) => item.id === state.career.careerId);
    const oldIncome = state.career.annualIncome;
    let newIncome = target.offerIncome || oldIncome;
    if (mode === "high_income") newIncome = Math.max(newIncome, oldIncome * rng.range(1.12, 1.32));
    if (mode === "negotiated") newIncome = Math.max(newIncome, oldIncome * rng.range(1.05, 1.2));
    if (mode === "activity") newIncome = Math.max(newIncome, oldIncome * rng.range(0.92, 1.22));
    chooseCareer(target.id, newIncome);
    state.career.stability = clamp(state.career.stability - 4);
    state.career.workPressure = clamp(state.career.workPressure + 3);
    addFlag("job_changed");
  }

  function performMove(mode, rng) {
    const currentIndex = DATA.regions.findIndex((r) => r.id === state.person.regionId);
    let candidates = DATA.regions;
    if (mode === "opportunity_city" || mode === "family_move") candidates = DATA.regions.filter((r) => r.job_opportunity > state.region.job_opportunity + 5);
    if (mode === "hometown") candidates = DATA.regions.filter((r) => r.housing_cost < state.region.housing_cost - 10);
    const target = rng.pick(candidates) || DATA.regions[Math.max(0, currentIndex - 1)] || state.region;
    state.region = deepClone(target);
    state.person.regionId = target.id;
    state.person.regionName = target.name;
    state.person.regionGroup = regionGroup(target.id);
    state.career.opportunityIndex = clamp(state.career.opportunityIndex * 0.55 + target.job_opportunity * 0.45);
    state.finance.housingAffordability = clamp(100 - target.housing_cost);
    addFlag("recent_move");
  }

  function createPartner(rng, source = "organic", status = "dating") {
    if (state.relationship.partner) return;
    const career = rng.pick(DATA.careers.filter((c) => c.id !== state.career.careerId));
    const [minIncome, maxIncome] = parseBand(career.start_band);
    const partner = {
      id: `partner-${state.time.turn}-${rng.int(1000, 9999)}`,
      age: clamp(state.time.age + rng.range(-3, 3), 18, 45),
      careerId: career.id,
      careerName: career.name,
      annualIncome: Math.round(rng.range(minIncome, maxIncome)),
      employed: true,
      jobRisk: clamp(Number(career.age_risk || 40) * 0.55 + (100 - Number(career.stability || 50)) * 0.35),
      familyClassId: rng.pick(DATA.familyClasses).id,
      childIntent: clamp(50 + rng.range(-28, 28)),
      marriageIntent: clamp(55 + rng.range(-25, 25)),
      householdLaborWillingness: clamp(52 + rng.range(-25, 25)),
      cityPreference: rng.pick(["current", "hometown", "opportunity_city"]),
      source,
    };
    state.relationship.partner = partner;
    state.relationship.status = status || "dating";
    state.relationship.quality = clamp(52 + rng.range(-8, 18));
    state.relationship.trust = clamp(50 + rng.range(-8, 18));
    state.relationship.opportunity = Math.max(0, state.relationship.opportunity - 2);
    state.relationship.childIntentGap = Math.abs(state.relationship.childIntent - partner.childIntent);
    addFlag("has_partner");
  }

  function maybeCreatePartner(rng) {
    state.relationship.opportunity = clamp(state.relationship.opportunity + 3);
    if (!state.relationship.partner && rng.next() < clamp(0.18 + state.relationship.opportunity / 100 + state.stats.peerRelationship / 500, 0.18, 0.62)) {
      createPartner(rng, "activity", "dating");
    }
  }

  function addChild(age, rng) {
    state.children.push({
      id: `child-${state.time.turn}-${rng.int(1000, 9999)}`,
      age,
      health: clamp(72 + rng.range(-12, 15)),
      educationExpectation: clamp(50 + state.stats.culturalCapital * 0.25 + rng.range(-15, 15)),
    });
    state.care.childcareBurden = clamp(state.care.childcareBurden + 35);
    state.relationship.childProgress = 100;
    removeFlag("pregnant");
    addFlag("has_child");
  }

  function buildEmergencyFund() {
    if (state.finance.cashRmb <= 0) return;
    state.finance.emergencyMonths = clamp(state.finance.emergencyMonths + 2, 0, 60);
    state.career.stability = clamp(state.career.stability + 2);
  }

  function buyHouse(rng) {
    if (state.finance.housingStatus === "owned_mortgage") return;
    const downPayment = Math.max(80000, state.region.housing_cost * 3500);
    const familySupport = state.family.wealth >= 65 ? downPayment * 0.4 : 0;
    const ownContribution = Math.min(state.finance.cashRmb, downPayment - familySupport);
    if (ownContribution + familySupport < downPayment * 0.7) {
      state.stats.stress = clamp(state.stats.stress + 4);
      return;
    }
    state.finance.cashRmb = Math.max(0, state.finance.cashRmb - ownContribution);
    state.finance.housingStatus = "owned_mortgage";
    state.finance.mortgageBalance = Math.round(downPayment * rng.range(4.2, 7.0));
    state.finance.housingSecurity = clamp(state.finance.housingSecurity + 15);
    state.stats.autonomy = clamp(state.stats.autonomy - 3);
    addFlag("bought_house");
  }

  function repayMortgage() {
    if (state.finance.mortgageBalance <= 0 || state.finance.cashRmb <= 0) return;
    const amount = Math.min(state.finance.cashRmb * 0.45, state.finance.mortgageBalance * 0.15);
    state.finance.cashRmb -= amount;
    state.finance.mortgageBalance -= amount;
    state.stats.stress = clamp(state.stats.stress - 2);
  }

  function resolveEventChoice(choiceCode) {
    if (state.phase !== "event_selection" || !state.pendingEvent) return;
    const event = state.pendingEvent;
    const choice = event.choices.find((item) => item.code === choiceCode);
    if (!choice) return;
    const before = snapshotPaths(CORE_STAT_PATHS);
    const applied = withRng((rng) => {
      const effects = applyEffectOps(choice.effectOps, 1, event.title, rng);
      for (const action of choice.actions || []) applyAction(action, rng);
      return effects;
    });
    normalizeState();
    state.cooldowns[event.id] = state.time.turn;
    const eventDecision = {
      eventId: event.id,
      title: event.title,
      type: event.type,
      choiceCode: choice.code,
      choiceText: choice.text,
      delayedText: choice.delayedText || "",
      effects: applied.map((row) => ({ target: row.target, value: round(row.value, 2) })),
    };
    if (!state.currentTurnRecord) {
      state.currentTurnRecord = {
        turn: state.time.turn, stageId: currentStage().id, stageName: currentStage().name,
        age: state.time.age, year: state.time.year, selectedActivities: [], passive: state.currentPassiveSummary || null,
        event: null, snapshotBefore: getVisibleSnapshot(),
      };
    }
    if (!state.currentTurnRecord.events) state.currentTurnRecord.events = [];
    state.currentTurnRecord.events.push(eventDecision);
    state.currentTurnRecord.event = eventDecision;
    state.decisions.push({
      turn: state.time.turn, age: state.time.age, year: state.time.year, stageId: currentStage().id,
      kind: "event", eventId: event.id, choiceCode: choice.code,
    });
    const eventDeltas = compareSnapshots(before, snapshotPaths(CORE_STAT_PATHS));
    const activityDeltas = state.currentTurnRecord?.activityDeltas || [];
    lastTurnDeltas = [...activityDeltas, ...eventDeltas]
      .reduce((rows, item) => {
        const existing = rows.find((row) => row.path === item.path);
        if (existing) {
          existing.after = item.after;
          existing.delta = existing.after - existing.before;
        } else {
          rows.push({ ...item });
        }
        return rows;
      }, [])
      .filter((row) => Math.abs(row.delta) >= 0.4)
      .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    state.pendingEvent = null;

    if (event.id === "GEN_EMPLOYMENT_OFFERS") {
      state.milestones.employmentOfferDecision = deepClone(eventDecision);
      state.currentTurnRecord = null;
      state.selectedActivities = [];
      state.phase = "activity_selection";
      lastTurnDeltas = [];
      saveState();
      render();
      return;
    }

    if (state.eventQueue.length) {
      const nextId = state.eventQueue.shift();
      state.pendingEvent = deepClone(DATA.events.find((e) => e.id === nextId));
      saveState();
      render();
      return;
    }

    if (Number(state.actionStep || 0) < 3 && Number(currentStage()?.activities || 0) > 0) {
      state.phase = "activity_selection";
      state.selectedActivities = [];
      saveState();
      render();
      return;
    }
    finishTurn();
  }

  function applyScheduledActions() {
    const due = state.scheduledActions.filter((item) => item.dueTurn <= state.time.turn);
    state.scheduledActions = state.scheduledActions.filter((item) => item.dueTurn > state.time.turn);
    if (!due.length) return;
    withRng((rng) => due.forEach((item) => applyAction(item.action, rng)));
  }

  function resolvePassiveTurnStart() {
    const stage = currentStage();
    if (!stage || state.turnStartResolvedFor === `${state.time.turn}:${stage.id}`) return;
    state.turnStartResolvedFor = `${state.time.turn}:${stage.id}`;
    const summary = { income: 0, expense: 0, net: 0, notes: [] };

    if (stage.group === "adult") {
      const halfIncome = state.career.status === "employed" ? state.career.annualIncome * 0.5
        : state.career.status === "flexible" ? state.career.annualIncome * withRng((rng) => rng.range(0.32, 0.65))
          : state.career.status === "entrepreneur" ? state.career.annualIncome * withRng((rng) => rng.range(-0.15, 0.72))
            : state.career.sideHustleProgress * 800;
      const afterTax = Math.max(0, halfIncome * (state.career.orgType === "public" ? 0.84 : 0.82));
      const baseMonthly = 1800 + state.region.living_cost * 42;
      let housingMonthly = 0;
      if (["rent", "shared_rent", "rent_far", "school_district_rent"].includes(state.finance.housingStatus)) {
        housingMonthly = 800 + state.region.housing_cost * (state.finance.housingStatus === "shared_rent" ? 45 : 72);
      } else if (state.finance.mortgageBalance > 0) {
        housingMonthly = Math.max(1800, state.finance.mortgageBalance * 0.0065);
      }
      const childExpense = state.children.reduce((sum, child) => sum + (child.age <= 3 ? 7000 : child.age <= 6 ? 5500 : 4200), 0);
      const parentCareExpense = state.care.parentCareBurden * 85;
      const debtExpense = Math.min(state.finance.debtRmb * 0.12, 15000);
      const halfExpense = (baseMonthly + housingMonthly) * 6 + childExpense + parentCareExpense + debtExpense;
      const net = afterTax - halfExpense;
      summary.income = halfIncome;
      summary.expense = halfExpense;
      summary.net = net;
      state.finance.lastHalfIncome = halfIncome;
      state.finance.lastHalfExpense = halfExpense;
      state.finance.cashRmb += net;
      if (state.finance.cashRmb < 0) {
        state.finance.debtRmb += Math.abs(state.finance.cashRmb);
        state.finance.cashRmb = 0;
        summary.notes.push("现金不足，缺口转为债务。 ");
      }
      if (state.career.status === "employed") {
        state.career.experienceMonths += 6;
        state.career.performance = clamp(state.career.performance + withRng((rng) => rng.range(-2, 3)));
        state.career.companyRisk = clamp(state.career.companyRisk + withRng((rng) => rng.range(-4, 5)) + (state.world.scenario.layoff_risk - 1) * 6);
        const ageRisk = state.time.age >= 30 ? (state.time.age - 29) * state.career.ageRiskBase / 75 : 0;
        state.career.layoffExposure = clamp(state.career.ageRiskBase * 0.38 + state.career.companyRisk * 0.38 + ageRisk - state.career.transferableSkill * 0.18 - state.career.performance * 0.12);
      }
      state.career.workPressure = clamp(state.career.workPressure + withRng((rng) => rng.range(-2, 3)));
      state.stats.stress = clamp(state.stats.stress + Math.max(0, state.career.workPressure - 65) * 0.035 + state.care.childcareBurden * 0.018 + state.care.parentCareBurden * 0.012);
      state.stats.physicalHealth = clamp(state.stats.physicalHealth - Math.max(0, state.career.workPressure - 70) * 0.018 - state.time.age * 0.015);
      if (state.relationship.partner) {
        state.relationship.quality = clamp(state.relationship.quality - 1 - state.stats.stress / 180 + state.relationship.fairness / 180);
        if (state.relationship.partner.employed) state.relationship.partner.jobRisk = clamp(state.relationship.partner.jobRisk + withRng((rng) => rng.range(-4, 5)));
      }
      if (state.time.age >= 28) {
        state.family.parentHealth = clamp(state.family.parentHealth - withRng((rng) => rng.range(0.2, 1.8)));
        state.care.parentCareBurden = clamp((60 - state.family.parentHealth) * 1.3 + Math.max(0, state.time.age - 30) * 1.5);
      }
      state.children.forEach((child) => { child.age += 0.5; });
      state.care.childcareBurden = clamp(state.children.reduce((sum, child) => sum + (child.age <= 3 ? 30 : child.age <= 6 ? 22 : 12), 0));
    } else {
      state.stats.stress = clamp(state.stats.stress + Math.max(0, state.education.schoolQuality - 75) * 0.02);
      if (stage.group === "high" && state.education.schoolType === "HS_B") {
        state.stats.stress = clamp(state.stats.stress + 2.5);
        state.stats.physicalHealth = clamp(state.stats.physicalHealth - 0.8);
      }
    }
    if (stage.group !== "adult") {
      const halfYearIncome = (state.family.incomeIndex - 42) * 0.11 + withRng(rng => rng.range(-1.2, 2.2));
      const debtDrag = state.family.debtIndex * 0.025;
      const stabilityBonus = (state.family.stability - 50) * 0.018;
      const capitalDelta = clamp(halfYearIncome + stabilityBonus - debtDrag, -4.5, 4.5);
      state.stats.economicCapital = clamp(state.stats.economicCapital + capitalDelta);
      state.family.wealth = clamp(state.family.wealth + capitalDelta * 0.45);
      state.family.incomeIndex = clamp(state.family.incomeIndex + withRng(rng => rng.range(-1.5, 1.8)));
      summary.familyCapitalDelta = capitalDelta;
      if (capitalDelta > 0.5) summary.notes.push("家庭本半年形成了少量可支配结余。 ");
      if (capitalDelta < -0.5) summary.notes.push("生活支出和债务继续挤压可用于教育的资源。 ");
    }
    state.currentPassiveSummary = summary;
    applyScheduledActions();
    normalizeState();
  }

  function generateTurnNarrative() {
    const stage = currentStage();
    if (!stage) return "";
    if (state.stats.stress >= 82) {
      return "排名、绩效或家庭责任仍在继续运转，身体开始用睡眠和疼痛提交另一份报表。系统通常把它称为个人状态问题。";
    }
    if (stage.group === "adult" && state.finance.mortgageBalance > 0 && state.career.stability < 45) {
      return "房子提供了居住的确定性，房贷要求职业也保持同样的确定性。两者并没有提前商量过行业周期。";
    }
    if (stage.group === "adult" && state.children.length > 0 && state.relationship.partner) {
      return "家庭收入仍在结算，照护时间却没有工资单。谁减少工作、谁承担夜间和谁向老人求助，都会进入下一年的职业结果。";
    }
    if (state.family.wealth < 28 && state.stats.score > 70) {
      return "成绩证明了能力，家庭开始计算继续培养这种能力需要多少钱。希望第一次变得具体，也第一次变得昂贵。";
    }
    if (state.family.wealth > 72 && state.stats.mentalHealth < 45) {
      return "资源让失败更容易被修复，高期待让失败更难被承认。这个家庭拥有很多选择，却不一定允许每一种选择发生。";
    }
    if (stage.group === "adult" && state.career.status === "unemployed") {
      return "失业让日历突然空了下来，账单并没有因此失去日期。过去积累的技能、关系和储备金开始接受检验。";
    }
    if (state.stats.autonomy >= 75 && state.stats.satisfaction >= 65) {
      return "你减少了一部分可被比较的增长，把时间重新划回自己的生活。外部评价变慢，日常却开始恢复可持续性。";
    }
    return "这一回合没有把结构约束消除，只是重新分配了分数、时间、钱和关系之间的压力。下一次选择会从这个结果继续。";
  }

  function finishTurn() {
    const stage = currentStage();
    if (!stage) return;
    state.lastNarrative = generateTurnNarrative();
    state.currentTurnRecord.snapshotAfter = getVisibleSnapshot();
    state.currentTurnRecord.narrative = state.lastNarrative;
    state.history.push(deepClone(state.currentTurnRecord));
    state.decisions.push({
      turn: state.time.turn, age: state.time.age, year: state.time.year, stageId: stage.id,
      kind: "activities", activityIds: (state.currentTurnRecord?.selectedActivities || []).map(item => item.id),
    });
    state.currentTurnRecord = null;
    state.selectedActivities = [];
    state.actionStep = 0;
    state.phase = stage.finalAdultTurn ? "ending" : "turn_summary";
    if (stage.finalAdultTurn) finalizeEnding();
    saveState();
    render();
  }

  function advanceTurn() {
    if (state.phase !== "turn_summary") return;
    maybeInsertPostgraduate();
    state.currentStageIndex += 1;
    state.time.turn += 1;
    if (state.currentStageIndex >= state.timeline.length) {
      finalizeEnding();
      state.phase = "ending";
      saveState();
      render();
      return;
    }
    syncTimeWithStage();
    state.turnStartResolvedFor = null;
    state.currentPassiveSummary = null;
    state.phase = "activity_selection";
    state.pendingEvent = null;
    state.eventQueue = [];
    lastTurnDeltas = [];
    ensureStageReady();
    saveState();
    render();
  }

  function ensureStageReady() {
    syncTimeWithStage();
    resolvePassiveTurnStart();
    const stage = currentStage();
    if (!stage) return;
    if (stage.group === "adult" && !state.career.careerId) {
      state.phase = "event_selection";
      state.pendingEvent = makeEmploymentOfferEvent();
      if (!state.currentTurnRecord) {
        state.currentTurnRecord = {
          turn: state.time.turn, stageId: stage.id, stageName: stage.name, age: state.time.age, year: state.time.year,
          selectedActivities: [], passive: state.currentPassiveSummary || null, event: null, snapshotBefore: getVisibleSnapshot(),
        };
      }
    } else if (stage.activities === 0 && state.phase === "activity_selection") {
      state.currentTurnRecord = {
        turn: state.time.turn, stageId: stage.id, stageName: stage.name, age: state.time.age, year: state.time.year,
        selectedActivities: [], passive: state.currentPassiveSummary || null, event: null, snapshotBefore: getVisibleSnapshot(),
      };
      state.actionStep = 3;
      state.phase = "event_selection";
      prepareEventForCurrentTurn();
    }
  }

  function finalizeEnding() {
    state.completedAt = new Date().toISOString();
    normalizeState();
    const tags = generateEndingTags();
    state.ending.tags = tags;
    state.ending.commentary = generateEndingCommentary(tags);
    state.phase = "ending";
  }

  function generateEndingTags() {
    const tags = [];
    const add = (id, tag, dimension, tone) => { if (!tags.some((x) => x.id === id)) tags.push({ id, tag, dimension, tone }); };
    const c = state.career;
    const f = state.finance;
    const r = state.relationship;
    if (c.incomeIndex >= 70 && c.stability < 38) add("T01", "高薪职业中断", "职业", "拥有高收入履历与技能，同时正在失去组织提供的确定性。");
    if (c.stability >= 80 && c.incomeIndex < 55 && state.stats.autonomy < 60) add("T02", "稳定岗位停滞", "职业", "生活很少突然坠落，向上的空间也变得狭窄。");
    if (c.transferableSkill >= 78) add("T03", "稀缺技能护城河", "职业", "职位可以变化，已经积累的解决问题能力仍能被带走。");
    if (PUBLIC_CAREERS.has(c.careerId) && state.stats.autonomy < 48) add("T05", "体制内地域绑定", "职业", "稳定来自一个具体组织和地点，离开也意味着重新定价。");
    if ((state.education.degreeTier === "T5" || !state.education.degreeLevel) && state.stats.vocationalSkill >= 70 && c.stability >= 55) add("T06", "技能劳动者的尊严", "职业", "学历没有替你开门，手上的技能让工作结果可以被看见。");
    if (["flexible", "entrepreneur"].includes(c.status) && c.stability < 42) add(c.status === "entrepreneur" ? "T08" : "T07", c.status === "entrepreneur" ? "创业仍在现金流里" : "灵活就业的高波动", "职业", c.status === "entrepreneur" ? "上限仍在远处，下一期账单更靠近。" : "时间看似自由，订单和保障把自由切成更小的单位。");
    if (hasFlag("returned_hometown")) add("T10", "回乡后的重新定价", "职业", "住房和照护变得容易，职业机会需要用新的尺度计算。");
    if (f.mortgageBalance > 0 && f.debtIndex >= 55) add("T11", "有房但高杠杆", "财务", "房子提供居住的确定性，也固定了每月必须发生的现金流。");
    if (!["owned_mortgage", "family_owned_mortgage"].includes(f.housingStatus) && f.emergencyMonths >= 12 && state.stats.autonomy >= 62) add("T12", "租房但保有流动性", "财务", "你没有把未来固定在一套房里，也没有完全摆脱租约的不确定。");
    if (state.family.supportHousing || state.family.wealth >= 72) add("T13", "家庭资产托底", "财务", "失败的代价被家庭资产吸收了一部分，选择空间因此扩大。");
    if (f.emergencyMonths < 3 && state.family.wealth < 35) add("T14", "没有失败缓冲", "财务", "很多选择表面开放，账单把它们迅速收窄。");
    if (r.partner && r.quality >= 72 && r.fairness >= 60) add("T19", "稳定伴侣共同承担", "关系", "稳定来自重复的协商，而不是一次结婚登记。");
    if (r.status === "married" && r.quality >= 38 && r.quality <= 66) add("T20", "婚姻仍在谈判", "关系", "关系没有结束，也没有自动解决房子、照护和生育分工。");
    if (r.status === "long_distance") add("T21", "异地与职业并行", "关系", "两条职业路径暂时没有合并成同一张地图。");
    if (r.status === "single" && state.stats.autonomy >= 70 && state.stats.socialCapital >= 55) add("T22", "单身高自主", "关系", "没有伴侣并未让生活停止组织，你把支持分散在朋友、工作和自己身上。");
    if (r.status === "single" && state.stats.socialCapital < 35) add("T23", "单身支持网不足", "关系", "自主仍在，危机到来时可以拨出的电话太少。");
    if (hasFlag("relationship_ended") && state.stats.mentalHealth >= 50) add("T24", "关系结束后的重建", "关系", "共同生活结束后，你正在重新分配住房、时间和对未来的解释。");
    if (r.finalChildDecision === "childfree") add("T25", "主动不育", "生育/照护", "你把不生育作为长期生活安排，而非等待被纠正的状态。");
    if (state.children.length === 0 && ["open", null].includes(r.finalChildDecision)) add("T26", "仍在协商生育", "生育/照护", "问题被保留下来，时间和关系会继续给它新的条件。");
    if (state.children.length > 0 && hasFlag("career_reduced_for_childcare")) add("T27", "成为父母后的职业转向", "生育/照护", "养育带来新的关系，也重新排列了职业增长的顺序。");
    if (state.care.grandparentCareShare >= 40) add("T28", "祖辈托育下的代际共同体", "生育/照护", "三代人的时间互相托住，也互相进入对方的生活边界。");
    if (state.care.parentCareBurden >= 65) add("T30", "代际照护中心", "生育/照护", "你成为家庭资源流动的中间节点，钱、时间和情绪都从这里经过。");
    if (r.finalChildDecision === "open") add("T32", "家庭规模保持开放", "生育/照护", "你没有把不确定写成承诺，也没有把它当作失败。");
    if (c.incomeIndex >= 70 && state.stats.stress >= 78) add("T33", "高薪与高倦怠并存", "健康/自主", "收入证明你被需要，身体正在提出另一套证据。");
    if (state.stats.physicalHealth < 45) add("T35", "慢性健康成本", "健康/自主", "很多选择仍可进行，只是每一次都需要额外预算身体。");
    if (c.incomeIndex < 60 && state.stats.autonomy >= 72 && state.stats.satisfaction >= 62) add("T36", "低欲望高自主", "健康/自主", "你退出了一部分比较，生活没有因此变成空白。");
    const origin = tierOfFamily(state.family.classId);
    const current = estimateClassTier();
    if (current - origin >= 2 && (state.family.wealth < 50 || f.debtIndex >= 55)) add("T37", "向上流动后的脆弱中产", "阶层", "你已经离开起点，新的位置还没有形成足够厚的安全垫。");
    if (current >= 3 && c.stability >= 65 && state.stats.physicalHealth >= 50 && f.emergencyMonths >= 6) add("T38", "稳定小中产", "阶层", "生活没有戏剧性跃升，基本风险被逐步压低。");
    if (["county", "rural"].includes(state.person.regionGroup) && ["T0", "T1", "T2"].includes(state.education.degreeTier) && state.stats.stress >= 50) add("T39", "小镇做题家式上升", "阶层", "考试把你带到更大的城市，文化适配仍需要额外学习。");
    if (current < origin) add("T40", "代际位置下滑", "阶层", "下降由周期、家庭事件和个人选择共同形成，无法归结为单一失败。");
    if (!tags.length) add("T38", "尚未定型的普通生活", "阶层", "生活没有抵达统一答案，资源、关系和身体仍在共同决定下一段路。 ");
    const dimensions = new Set();
    const selected = [];
    for (const tag of tags) {
      if (!dimensions.has(tag.dimension) || selected.length < 3) {
        selected.push(tag);
        dimensions.add(tag.dimension);
      }
      if (selected.length >= 5) break;
    }
    const neutralFallbacks = [
      {
        id: "N01",
        tag: c.status === "unemployed" ? "职业重新开局" : c.status === "transitioning" ? "职业转换未决" : "职业仍在积累",
        dimension: "职业",
        tone: c.status === "unemployed" ? "组织关系已经中断，技能、储备与城市机会将决定下一步。" : "现有工作提供收入和经验，也仍在接受行业周期的重新定价。",
      },
      {
        id: "N02",
        tag: f.emergencyMonths >= 6 ? "有限现金缓冲" : "现金流仍然紧张",
        dimension: "财务",
        tone: f.emergencyMonths >= 6 ? "储备足以承受一段有限空窗，长期责任仍会持续扣款。" : "可以选择的方向仍然存在，能够承受的试错时间较短。",
      },
      {
        id: "N03",
        tag: state.stats.physicalHealth >= 55 && state.stats.mentalHealth >= 55 && state.stats.stress < 70 ? "身体尚能承受" : "恢复需要进入预算",
        dimension: "健康/自主",
        tone: state.stats.stress < 70 ? "当前生活尚可持续，健康仍会随责任和工时继续变化。" : "继续前进仍然可能，恢复不能再只依靠下一次假期。",
      },
      {
        id: "N04",
        tag: "关系结构仍开放",
        dimension: "关系",
        tone: "亲密关系、朋友与家庭支持仍在变化，没有一种状态自动提供完整保障。",
      },
    ];
    for (const fallback of neutralFallbacks) {
      if (selected.length >= 3) break;
      if (!dimensions.has(fallback.dimension)) {
        selected.push(fallback);
        dimensions.add(fallback.dimension);
      }
    }
    return selected.slice(0, 5);
  }

  function tierOfFamily(id) {
    const n = Number(String(id || "F03").replace("F", ""));
    return clamp(n - 1, 0, 6);
  }

  function estimateClassTier() {
    const income = state.career.incomeIndex;
    const stability = state.career.stability;
    const assets = state.finance.housingSecurity + state.finance.emergencyMonths * 2 - state.finance.debtIndex;
    const score = income * 0.42 + stability * 0.28 + clamp(assets) * 0.3;
    if (score >= 85) return 6;
    if (score >= 74) return 5;
    if (score >= 62) return 4;
    if (score >= 50) return 3;
    if (score >= 38) return 2;
    if (score >= 25) return 1;
    return 0;
  }

  function generateEndingCommentary(tags) {
    const careerLine = state.career.careerName
      ? `35岁时，你的主要职业位置是“${state.career.careerName}”，年收入约${formatMoney(state.career.annualIncome)}，职业稳定为${round(state.career.stability)}/100。`
      : "35岁时，你仍处在职业转换或失业状态，过去积累的技能和现金缓冲正在接受检验。";
    const familyLine = state.relationship.status === "single"
      ? "亲密关系仍为空缺或主动留白，支持网络主要来自朋友、工作和原生家庭。"
      : `当前关系状态为${relationshipStatusName(state.relationship.status)}，关系质量为${round(state.relationship.quality)}/100。`;
    const childLine = state.children.length
      ? `你已经承担${state.children.length}名子女的养育责任，照护时间和职业增长开始使用同一份预算。`
      : state.relationship.finalChildDecision === "childfree"
        ? "你把不生育写成了明确的长期安排。"
        : "是否带下一代来到世界仍被保留为一个开放问题。";
    const finalLine = state.ending.direction === "pause_restore"
      ? "你选择暂时停下，让身体和判断先恢复。未来并未得到保证，但下一次选择不必继续由疲惫代替。"
      : state.ending.direction === "low_cost_care"
        ? "你准备把生活移向成本更低、强度更小或更靠近家人的位置。职业上限可能下降，时间和照护距离会重新定价。"
        : state.ending.direction === "high_risk_opportunity"
          ? "你保留了高风险机会，也接受收入、地域和关系继续波动。"
          : "你选择继续在当前城市和路径积累。稳定会增加，原有约束也会随之延长。";
    return `${careerLine}${familyLine}${childLine}${finalLine}`;
  }

  function relationshipStatusName(status) {
    return { single: "单身", dating: "恋爱", long_distance: "异地恋", cohabiting: "同居", married: "已婚", separated: "分居", divorced: "离婚" }[status] || status;
  }

  function buildFinalPayload() {
    const completedAt = state.completedAt || new Date().toISOString();
    const payload = {
      schemaVersion: DATA.collectionSchema.version,
      runId: state.runId,
      gameVersion: state.gameVersion,
      dataVersion: state.dataVersion,
      studyId: config.studyId || "default",
      seed: state.seed,
      durationMs: Math.max(0, new Date(completedAt).getTime() - new Date(state.startedAt).getTime()),
      initialization: {
        birthYear: state.time.birthYear,
        gender: state.person.gender,
        regionId: state.person.regionId,
        regionGroup: state.person.regionGroup,
        hukou: state.person.hukou,
        familyClassId: state.family.classId,
        parentingStyleId: state.family.parentingStyleId,
        familyStructure: state.family.structure,
        worldScenarioId: state.world.scenarioId,
      },
      decisions: state.decisions.map((item) => deepClone(item)),
      milestones: deepClone(state.milestones),
      finalState: {
        age: 35,
        stats: deepClone(state.stats),
        education: {
          degreeTier: state.education.degreeTier,
          degreeLevel: state.education.degreeLevel,
          majorId: state.education.majorId,
          track: state.education.track,
          gaokaoStrength: round(state.education.gaokaoStrength, 2),
        },
        career: {
          status: state.career.status,
          careerId: state.career.careerId,
          annualIncome: round(state.career.annualIncome),
          stability: round(state.career.stability, 2),
          transferableSkill: round(state.career.transferableSkill, 2),
          layoffExposure: round(state.career.layoffExposure, 2),
        },
        finance: {
          cashRmb: round(state.finance.cashRmb),
          debtRmb: round(state.finance.debtRmb),
          mortgageBalance: round(state.finance.mortgageBalance),
          housingStatus: state.finance.housingStatus,
          emergencyMonths: round(state.finance.emergencyMonths, 2),
        },
        relationship: {
          status: state.relationship.status,
          quality: round(state.relationship.quality, 2),
          finalChildDecision: state.relationship.finalChildDecision,
        },
        childrenCount: state.children.length,
        care: {
          parentCareBurden: round(state.care.parentCareBurden, 2),
          childcareBurden: round(state.care.childcareBurden, 2),
          grandparentCareShare: round(state.care.grandparentCareShare, 2),
        },
        classTier: estimateClassTier(),
      },
      endingTags: state.ending.tags.map((tag) => tag.id),
      endingDirection: state.ending.direction,
      historyDigest: simpleDigest(JSON.stringify(state.decisions)),
      consent: { version: CONSENT_VERSION, finalOnly: true, explicit: false },
    };
    return payload;
  }

  function simpleDigest(text) {
    return hashString(text).toString(16).padStart(8, "0");
  }

  async function submitFinalData() {
    const consent = document.getElementById("data-consent");
    if (!consent?.checked) {
      showToast("请先勾选匿名数据提交同意。", "warn");
      return;
    }
    const payload = buildFinalPayload();
    payload.consent.explicit = true;
    if (!config.collectionEndpoint) {
      downloadJson(payload, `分数关系与出路_${state.runId}_最终数据.json`);
      showToast("尚未配置回收地址，已改为下载匿名数据文件。", "info");
      return;
    }
    const button = document.getElementById("submit-data-button");
    if (button) button.disabled = true;
    try {
      storageSet(PENDING_SUBMISSION_KEY, JSON.stringify(payload));
      await fetch(config.collectionEndpoint, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify(payload),
        keepalive: true,
      });
      storageRemove(PENDING_SUBMISSION_KEY);
      state.ending.submittedAt = new Date().toISOString();
      saveState();
      showToast("最终匿名数据提交请求已发出；回收表是否写入以后台记录为准。此前没有提交任何回合数据。", "success");
      render();
    } catch (error) {
      console.error(error);
      showToast("提交失败，数据已保留在本机。可以重试或下载数据文件。", "error");
    } finally {
      if (button) button.disabled = false;
    }
  }

  function downloadJson(payload, filename) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportSave() {
    downloadJson(state, `分数关系与出路_${state.runId}_存档.json`);
  }

  function importSave(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.runId || !parsed.timeline) throw new Error("invalid save");
        state = parsed;
        normalizeState();
        saveState();
        showToast("存档已导入。", "success");
        render();
      } catch (error) {
        showToast("存档文件无法识别。", "error");
      }
    };
    reader.readAsText(file, "utf-8");
  }

  function saveState() {
    if (!state) return;
    storageSet(SAVE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = storageGet(SAVE_KEY);
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      if (parsed.gameVersion !== ENGINE_VERSION || parsed.dataVersion !== DATA.metadata.dataVersion) return null;
      return parsed;
    } catch (error) {
      return null;
    }
  }

  function newGame(seedValue) {
    const seed = seedValue || randomSeed();
    state = buildInitialState(seed);
    syncTimeWithStage();
    resolvePassiveTurnStart();
    saveState();
    lastTurnDeltas = [];
    render();
  }

  function confirmNewGame() {
    const seedInput = document.getElementById("new-seed-input");
    const seed = seedInput?.value.trim() || undefined;
    if (state && state.history.length && !window.confirm("重新开局会覆盖当前本地存档。继续吗？")) return;
    newGame(seed);
  }

  function showToast(message, type = "info") {
    let node = document.getElementById("toast");
    if (!node) {
      node = document.createElement("div");
      node.id = "toast";
      document.body.appendChild(node);
    }
    node.className = `toast ${type} visible`;
    node.textContent = message;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => node.classList.remove("visible"), 3200);
  }

  function statTone(value, reverse = false) {
    const v = Number(value || 0);
    if (reverse) return v >= 75 ? "danger" : v >= 55 ? "warn" : "good";
    return v >= 70 ? "good" : v >= 45 ? "neutral" : "warn";
  }

      <div class="status-pill ${state.stats.stress>=70?'warn':''}"><span>压力</span><strong>${round(state.stats.stress)}</strong></div>
      <div class="status-pill"><span>心理 / 身体</span><strong>${round(state.stats.mentalHealth)} / ${round(state.stats.physicalHealth)}</strong></div>
      <div class="status-pill"><span>家庭经济资本</span><strong>${econ}</strong></div>
      <div class="status-pill"><span>文化 / 社会资本</span><strong>${round(state.stats.culturalCapital)} / ${round(state.stats.socialCapital)}</strong></div>
      <div class="status-pill"><span>同伴 / 关系</span><strong>${round(state.stats.peerRelationship)} / ${round(state.relationship.quality)}</strong></div>

  function renderIdentityCard() {

      ? `${state.education.degreeLevel} · ${state.education.degreeTier || ""} · ${state.education.majorName || "专业未定"}`

    return `
      <section class="panel identity-panel">

      </section>
