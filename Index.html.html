  function renderStats() {
    const stats = [
      ["成绩", state.stats.score, false], ["学习能力", state.stats.learning, false], ["自律", state.stats.discipline, false],
      ["压力", state.stats.stress, true], ["心理健康", state.stats.mentalHealth, false], ["身体健康", state.stats.physicalHealth, false],
      ["文化资本", state.stats.culturalCapital, false], ["社会资本", state.stats.socialCapital, false], ["经济资本", state.stats.economicCapital, false],
      ["自主", state.stats.autonomy, false], ["生活满意度", state.stats.satisfaction, false], ["信息敏感度", state.stats.infoSensitivity, false],
    ];
    if (currentStage()?.group === "adult") {
      stats.push(["职业稳定", state.career.stability, false], ["可迁移技能", state.career.transferableSkill, false], ["裁员暴露", state.career.layoffExposure, true], ["再就业韧性", state.career.reemploymentResilience, false]);
    }
    return `
      <section class="panel">
        <div class="panel-heading"><h2>核心属性</h2><span class="muted">0—100</span></div>
        <div class="stat-grid">
          ${stats.map(([label, value, reverse]) => `
            <div class="stat-card ${statTone(value, reverse)}">
              <div><span>${escapeHtml(label)}</span><strong>${round(value)}</strong></div>
              <div class="meter"><i style="width:${clamp(value)}%"></i></div>
            </div>
          `).join("")}
        </div>
      </section>
    `;
  }

  function renderFinanceCard() {
    if (currentStage()?.group !== "adult" && !state.education.degreeLevel) return "";
    return `
      <section class="panel finance-panel">
        <div class="panel-heading"><h2>成年生活账面</h2><span class="chip">本地计算</span></div>
        <div class="finance-grid">
          <div><span>年收入</span><strong>${formatMoney(state.career.annualIncome)}</strong></div>
          <div><span>现金储备</span><strong>${formatMoney(state.finance.cashRmb)}</strong></div>
          <div><span>非房贷债务</span><strong>${formatMoney(state.finance.debtRmb)}</strong></div>
          <div><span>房贷余额</span><strong>${formatMoney(state.finance.mortgageBalance)}</strong></div>
          <div><span>应急月数</span><strong>${round(state.finance.emergencyMonths, 1)}个月</strong></div>
          <div><span>父母照护负担</span><strong>${round(state.care.parentCareBurden)}/100</strong></div>
        </div>
        ${state.currentPassiveSummary && (state.currentPassiveSummary.income || state.currentPassiveSummary.expense) ? `
          <div class="cashflow-note">本半年自动结算：收入 ${formatMoney(state.currentPassiveSummary.income)}，生活与责任支出 ${formatMoney(state.currentPassiveSummary.expense)}，结余 ${formatMoney(state.currentPassiveSummary.net)}。</div>
        ` : ""}
      </section>
    `;
  }

  function schoolProfile() {
    const type = state.education.schoolType;
    const map = {
      S:["核心区优质学校","课程和活动资源充足，家长竞争也更早进入日常。","综合素质机会多","同伴比较与教育消费压力"],
      A:["省会或强区重点学校","教师与信息资源较好，应试和活动机会并存。","教师经验和信息","竞争与择校焦虑"],
      B:["普通城市学校","资源中等，具体老师和班级差异会放大。","稳定基础教育","偶然性较强"],
      C:["县城较好学校","管理更严，应试路径清晰，探索空间有限。","中考上升通道","单一路径与高压"],
      D:["乡镇或薄弱学校","基础资源有限，好老师和政策机会格外关键。","韧性与少量政策机会","信息差和教师流动"],
      HS_S:["省城超级高中","优秀同伴、竞赛和名校信息集中，公开排名也更残酷。","成绩成长与顶级机会","心理压力和同辈碾压"],
      HS_A:["市重点或省示范高中","应试经验和志愿信息较强，普通学生仍可能被边缘化。","稳定升学资源","排名竞争"],
      HS_B:["强县中","用极长学习时间换取应试提升，县城荣誉与个人健康同时下注。","应试提升","身体、心理与文化机会损耗"],
      HS_C:["普通高中","资源一般，个人自律、老师和志愿信息决定分化。","较多自主空间","升学信息有限"],
      HS_D:["民办高中","费用换来托底和管理，学校质量与家庭现金流都需继续检验。","录取托底","高学费与阶层比较"],
      HS_E:["职业高中/中专/技校","技能、实习和对口升学并存，学历标签也会长期存在。","技能积累与早就业","学历天花板和同伴风险"]
    };
    return map[type] || [schoolTypeName(type),"学校提供资源，也同时进行筛选。","当前可用资源","适配和信息差"];
  }

  function renderSchoolBrief() {
    const stage=currentStage();
    if (!stage || !["primary","junior","high","university","vocational","postgraduate"].includes(stage.group)) return "";
    const p=schoolProfile();
    const schoolName = state.education.degreeLevel ? `${state.education.degreeLevel} · ${tierName(state.education.degreeTier)} · ${state.education.majorName||"专业未定"}` : p[0];
    return `<section class="school-brief"><div class="eyebrow">当前学校与环境</div><h2>${escapeHtml(schoolName)}</h2><p>${escapeHtml(state.education.degreeLevel ? "学校层次、专业、城市与家庭支持共同决定可获得的实习、同伴和就业信号。" : p[1])}</p><div class="school-brief-grid"><div><span>学校质量</span><strong>${round(state.education.schoolQuality)}/100</strong></div><div><span>主要机会</span><strong>${escapeHtml(state.education.degreeLevel?"课程、实习、证书与同伴网络":p[2])}</strong></div><div><span>主要代价</span><strong>${escapeHtml(state.education.degreeLevel?"学费、绩点、城市成本与学历竞争":p[3])}</strong></div></div></section>`;
  }

  function renderNarrative() {
    return `
      <section class="narrative-card">
        <div class="eyebrow">社会学旁白</div>
        <p>${escapeHtml(state.lastNarrative)}</p>
      </section>
    `;
  }

  function renderSelectedActivities() {
    const done = state.currentTurnRecord?.selectedActivities || [];
    return `<div class="action-progress">${[1,2,3].map(n=>`<i class="${n<=state.actionStep?'done':n===state.actionStep+1?'current':''}"></i>`).join("")}</div>
      ${done.length?`<div class="muted">已完成：${done.map(x=>escapeHtml(x.name)).join(" · ")}</div>`:""}
      ${state.lastActionFeedback && state.lastActionFeedback.step===state.actionStep ? `<div class="feedback-flash"><h3>刚才的行动：${escapeHtml(state.lastActionFeedback.name)}</h3><div class="feedback-chips">${state.lastActionFeedback.deltas.length?state.lastActionFeedback.deltas.map(d=>`<span class="feedback-chip ${d.delta<0?'neg':''}">${escapeHtml(d.label)} ${d.delta>0?'+':''}${round(d.delta,1)}</span>`).join(''):'<span class="feedback-chip">主要影响进入隐藏变量或延迟事件</span>'}</div></div>`:""}`;
  }

  function effectPreview(activity) {
    const labels = {
      "stats.score": "成绩", "stats.learning": "学习", "stats.discipline": "自律", "stats.stress": "压力",
      "stats.mentalHealth": "心理", "stats.physicalHealth": "健康", "stats.culturalCapital": "文化",
      "stats.socialCapital": "关系网", "stats.economicCapital": "经济资本", "stats.autonomy": "自主",
      "career.transferableSkill": "技能", "career.incomeIndex": "收入", "career.stability": "稳定",
      "relationship.quality": "关系", "finance.cashIndex": "现金", "education.gpa": "绩点",
    };
    return (activity.effectOps || []).slice(0, 4).map((op) => {
      const spec = op.value;
      const value = spec.mode === "range" ? `${spec.min}~${spec.max}` : spec.value;
      const sign = Number(value) > 0 ? "+" : "";
      return `${labels[op.target] || op.target.split(".").pop()} ${sign}${value}`;
    }).join(" · ");
  }

  function renderActivities() {
    const stage = currentStage();
    if (!stage || state.phase !== "activity_selection") return "";
    const allRows = availableActivities();
    const categories = activityCategoryList();
    const rows = activityFilter === "全部" ? allRows : allRows.filter((item) => (item.category || "其他") === activityFilter);
    return `
      <section class="panel activity-panel">
        <div class="panel-heading">
          <div><h2>选择第${Math.min(3, Number(state.actionStep || 0) + 1)}次行动</h2><p class="muted">每次行动立即结算，并触发一个与行动、年龄、性别、家庭、学校或地域有关的事件。</p></div>
          <span class="counter-chip">${Math.min(3, Number(state.actionStep || 0) + 1)}/3</span>
        </div>
        ${renderSelectedActivities()}
        <div class="category-tabs">
          ${categories.map((cat) => `<button class="category-tab ${activityFilter === cat ? "active" : ""}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join("")}
        </div>
        <div class="activity-grid">
          ${rows.map((activity) => `
            <button class="activity-card" data-activity-id="${activity.id}">
              <span class="activity-category">${escapeHtml(activity.category || "活动")}</span>
              <strong>${escapeHtml(activity.name)}</strong>
              <p>${escapeHtml(activity.note || "")}</p>
              <small>${escapeHtml(effectPreview(activity))}</small>
            </button>
          `).join("")}
        </div>
        <div class="action-row">
          <button class="button primary" data-action="resolve-activities" ${state.selectedActivities.length === 1 ? "" : "disabled"}>执行这次行动</button>
        </div>
      </section>
    `;
  }

  function renderEvent() {
    if (state.phase !== "event_selection" || !state.pendingEvent) return "";
    const event = state.pendingEvent;
    return `
      <section class="panel event-panel">
        <div class="event-type">${escapeHtml(event.type || "事件")}</div>
        <h2>${escapeHtml(event.title)}</h2>
        <p class="event-text">${escapeHtml(event.text)}</p>
        <div class="event-options">
          ${event.choices.map((choice) => `
            <button class="event-choice" data-event-choice="${choice.code}">
              <span>${choice.code}</span>
              <div><strong>${escapeHtml(choice.text)}</strong>${choice.delayedText ? `<small>${escapeHtml(choice.delayedText)}</small>` : ""}</div>
            </button>
          `).join("")}
        </div>
      </section>
    `;
  }

  function renderTurnSummary() {
    if (state.phase !== "turn_summary") return "";
    const latest = state.history[state.history.length - 1];
    return `
      <section class="panel summary-panel">
        <div class="panel-heading"><h2>本回合结算</h2><span class="chip">${escapeHtml(latest?.stageName || "")}</span></div>
        <div class="delta-grid">
          ${lastTurnDeltas.length ? lastTurnDeltas.slice(0, 10).map((row) => `
            <div class="delta-row"><span>${escapeHtml(row.label)}</span><strong class="${row.delta > 0 ? "positive" : "negative"}">${row.delta > 0 ? "+" : ""}${round(row.delta, 1)}</strong></div>
          `).join("") : `<p class="muted">核心属性变化较小，部分后果已进入隐藏状态或延迟事件。</p>`}
        </div>
        <div class="summary-narrative">${escapeHtml(state.lastNarrative)}</div>
        <div class="action-row"><button class="button primary" data-action="next-turn">进入下一回合</button></div>
      </section>
    `;
  }

  function renderEnding() {
    if (state.phase !== "ending") return "";
    const payloadSize = Math.round(JSON.stringify(buildFinalPayload()).length / 1024);
    return `
      <section class="panel ending-panel">
        <div class="eyebrow">第三十五岁 · 开放结局</div>
        <h2>你抵达的是一个人生截面</h2>
        <p class="ending-commentary">${escapeHtml(state.ending.commentary)}</p>
        <div class="ending-tags">
          ${state.ending.tags.map((tag) => `<div class="ending-tag"><span>${escapeHtml(tag.dimension)}</span><strong>【${escapeHtml(tag.tag)}】</strong><p>${escapeHtml(tag.tone)}</p></div>`).join("")}
        </div>
        <div class="ending-state-grid">
          <div><span>职业</span><strong>${escapeHtml(state.career.careerName || state.career.status)}</strong></div>
          <div><span>年收入</span><strong>${formatMoney(state.career.annualIncome)}</strong></div>
          <div><span>职业稳定</span><strong>${round(state.career.stability)}/100</strong></div>
          <div><span>现金储备</span><strong>${formatMoney(state.finance.cashRmb)}</strong></div>
          <div><span>住房</span><strong>${escapeHtml(state.finance.housingStatus)}</strong></div>
          <div><span>关系</span><strong>${escapeHtml(relationshipStatusName(state.relationship.status))}</strong></div>
          <div><span>子女</span><strong>${state.children.length}名</strong></div>
          <div><span>生活满意度</span><strong>${round(state.stats.satisfaction)}/100</strong></div>
        </div>
      </section>
      <section class="panel collection-panel">
        <div class="panel-heading"><h2>最终数据回收</h2><span class="chip">结局时一次性</span></div>
        <p>整局过程一直保存在玩家浏览器的本地存储中。只有此处勾选同意并点击提交后，网页才会发送一份不含姓名、邮箱、电话、地址、设备指纹和自由文本的匿名数据包。</p>
        <details>
          <summary>查看会提交的字段</summary>
          <p class="muted">随机局ID、游戏与数据版本、出生年份、性别选项、地区类型、家庭阶层、每回合活动ID、事件选择、升学与职业节点、35岁最终状态、结局标签和数据完整性摘要。数据包约 ${payloadSize} KB。</p>
        </details>
        <p class="run-id-note">匿名局ID：<code>${escapeHtml(state.runId)}</code><br><small>保留此ID可用于核对重复记录或向运营者提出删除请求。</small></p>
        <label class="consent-row"><input id="data-consent" type="checkbox"> 我同意在游戏结束后提交上述匿名选择数据。</label>
        <div class="action-row wrap">
          <button id="submit-data-button" class="button primary" data-action="submit-final-data">${config.collectionEndpoint ? "提交匿名最终数据" : "下载匿名最终数据"}</button>
          <button class="button ghost" data-action="download-final-data">单独下载数据文件</button>
          <button class="button ghost" data-action="new-game">重新开局</button>
        </div>
        ${state.ending.submittedAt ? `<p class="success-note">已于 ${escapeHtml(state.ending.submittedAt)} 提交。</p>` : ""}
      </section>
    `;
  }

  function renderHistory() {
    const rows = state.history.slice(-8).reverse();
    return `
      <section class="panel history-panel">
        <div class="panel-heading"><h2>最近人生记录</h2><span class="muted">共${state.history.length}回合</span></div>
        ${rows.length ? `<div class="history-list">${rows.map((record) => `
          <div class="history-item">
            <div><strong>${escapeHtml(record.stageName)}</strong><span>${formatAge(record.age)} · ${record.year}年</span></div>
            <p>${escapeHtml(record.selectedActivities?.map((a) => a.name).join("、") || "关键节点")}</p>
            <small>${escapeHtml(record.event?.title || record.events?.[0]?.title || "普通生活结算")}</small>
          </div>
        `).join("")}</div>` : `<p class="muted">尚无已完成回合。</p>`}
      </section>
    `;
  }

  function renderDebug() {
    if (!state.ui.debug) return "";
    const stage = currentStage();
    return `
      <section class="panel debug-panel">
        <div class="panel-heading"><h2>调试面板</h2><span class="chip">仅本机</span></div>
        <div class="debug-actions">
          <button class="button ghost" data-jump-age="18">跳到18岁</button>
          <button class="button ghost" data-jump-age="22">跳到22岁</button>
          <button class="button ghost" data-jump-age="30">跳到30岁</button>
          <button class="button ghost" data-jump-age="34.5">跳到34岁半</button>
          <button class="button ghost" data-action="add-cash">现金+10万</button>
          <button class="button ghost" data-action="lower-health">健康-25</button>
          <button class="button ghost" data-action="raise-risk">裁员暴露+30</button>
        </div>
        <pre>${escapeHtml(JSON.stringify({ phase: state.phase, stage, pendingEvent: state.pendingEvent?.id, career: state.career, finance: state.finance, relationship: state.relationship, flags: state.flags }, null, 2))}</pre>
      </section>
    `;
  }

  function renderNewGameBar() {
    if (state.history.length || state.phase === "ending") return "";
    return `
      <section class="seed-bar">
        <label>固定种子重玩<input id="new-seed-input" value="${escapeHtml(state.seed)}"></label>
        <button class="button ghost" data-action="new-game">按此种子重新生成</button>
      </section>
    `;
  }

  function render() {
    if (!root || !state) return;
    ensureStageReady();
    root.innerHTML = `
      <div class="app-shell">
        ${renderStickyStatus()}
        ${renderHeader()}
        ${renderNewGameBar()}
        <main class="main-grid">
          <div class="main-column">
            ${renderNarrative()}
            ${renderSchoolBrief()}
            ${renderIdentityCard()}
            ${renderFinanceCard()}
            ${renderActivities()}
            ${renderEvent()}
            ${renderTurnSummary()}
            ${renderEnding()}
          </div>
          <aside class="side-column">
            ${renderStats()}
            ${renderHistory()}
          </aside>
        </main>
        ${renderDebug()}
        <footer>单机运行 · 自动本地存档 · 结局时才允许匿名数据提交 · 引擎 ${ENGINE_VERSION}</footer>
      </div>
    `;
    bindEvents();
  }

  function bindEvents() {
    root.querySelectorAll("[data-activity-id]").forEach((button) => button.addEventListener("click", () => selectActivity(button.dataset.activityId)));
    root.querySelectorAll("[data-remove-index]").forEach((button) => button.addEventListener("click", () => removeSelectedActivity(Number(button.dataset.removeIndex))));
    root.querySelectorAll("[data-category]").forEach((button) => button.addEventListener("click", () => { activityFilter = button.dataset.category; render(); }));
    root.querySelectorAll("[data-event-choice]").forEach((button) => button.addEventListener("click", () => resolveEventChoice(button.dataset.eventChoice)));
    root.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => handleAction(button.dataset.action)));
    root.querySelectorAll("[data-jump-age]").forEach((button) => button.addEventListener("click", () => jumpToAge(Number(button.dataset.jumpAge))));
    const fileInput = document.getElementById("import-save-input");
    if (fileInput) fileInput.addEventListener("change", () => { if (fileInput.files?.[0]) importSave(fileInput.files[0]); });
  }

  function handleAction(action) {
    switch (action) {
      case "resolve-activities": resolveActivities(); break;
      case "next-turn": advanceTurn(); break;
      case "export-save": exportSave(); break;
      case "new-game": confirmNewGame(); break;
      case "toggle-debug": state.ui.debug = !state.ui.debug; saveState(); render(); break;
      case "submit-final-data": submitFinalData(); break;
      case "download-final-data": downloadJson(buildFinalPayload(), `分数关系与出路_${state.runId}_最终数据.json`); break;
      case "add-cash": state.finance.cashRmb += 100000; normalizeState(); saveState(); render(); break;
      case "lower-health": state.stats.physicalHealth = clamp(state.stats.physicalHealth - 25); normalizeState(); saveState(); render(); break;
      case "raise-risk": state.career.layoffExposure = clamp(state.career.layoffExposure + 30); saveState(); render(); break;
      default: break;
    }
  }

  function jumpToAge(targetAge) {
    let index = state.timeline.findIndex((stage) => Number(stage.ageStart) >= targetAge && stage.group === (targetAge >= 18 ? "adult" : stage.group));
    if (targetAge >= 18 && !state.timeline.some((stage) => stage.group === "adult")) {
      state.timeline.splice(state.currentStageIndex + 1, state.timeline.length - state.currentStageIndex - 1, ...buildPostsecondaryTimeline("direct_work", 18));
      index = state.timeline.findIndex((stage) => stage.group === "adult" && Number(stage.ageStart) >= targetAge);
    }
    if (index < 0) index = state.timeline.findIndex((stage) => Number(stage.ageStart) >= targetAge);
    if (index < 0) return;
    state.currentStageIndex = index;
    state.time.turn += 1;
    syncTimeWithStage();
    state.turnStartResolvedFor = null;
    state.selectedActivities = [];
    state.actionStep = 0;
    state.pendingEvent = null;
    state.eventQueue = [];
    state.phase = "activity_selection";
    if (targetAge >= 18 && !state.career.careerId) {
      const option = careerOptionsForState(1)[0];
      if (option) chooseCareer(option.id, option.offerIncome);
    }
    ensureStageReady();
    saveState();
    render();
  }

  function getRuntimeConfig() {
    const params = new URLSearchParams(location.search);
    const base = globalThis.GAME_CONFIG || {};
    return {
      collectionEndpoint: params.get("collector") || base.collectionEndpoint || "",
      studyId: params.get("study") || base.studyId || "default",
    };
  }

  function boot(data) {
    DATA = data;
    config = getRuntimeConfig();
    root = document.getElementById("app");
    if (!root) throw new Error("Missing #app root");
    state = loadState() || buildInitialState(randomSeed());
    syncTimeWithStage();
    resolvePassiveTurnStart();
    normalizeState();
    render();
  }

  globalThis.ScoreRelationsGame = { boot, buildFinalPayload: () => buildFinalPayload(), getState: () => state };
})();

  </script>
  <script>
    try {
      const data = JSON.parse(document.getElementById("game-data").textContent);
      window.ScoreRelationsGame.boot(data);
    } catch (error) {
      console.error(error);
      document.getElementById("app").innerHTML = `
        <div class="boot-error">
          <h1>游戏载入失败</h1>
          <p>请保留完整 HTML 文件，并使用现代浏览器重新打开。</p>
          <pre>${String(error.message || error)}</pre>
        </div>`;
    }
  </script>
</body>
</html>
