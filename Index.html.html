<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《分数、关系与出路》中国现实主义教育—就业文字模拟器 Alpha 0.2">
  <title>分数、关系与出路 · Alpha 0.2 强化反馈版</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f3efe5;
  --paper-deep: #e9e2d2;
  --panel: rgba(255, 253, 247, 0.94);
  --ink: #1e2423;
  --muted: #6c716c;
  --line: #d6cdbb;
  --line-strong: #b8ad98;
  --accent: #8d342d;
  --accent-deep: #66251f;
  --accent-soft: #f1dfda;
  --green: #3f6a55;
  --green-soft: #e2ece5;
  --amber: #8a6428;
  --amber-soft: #f2ead5;
  --danger: #93443d;
  --danger-soft: #f2ded9;
  --shadow: 0 18px 50px rgba(57, 48, 35, 0.09);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 9px;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.65;
  background:
    radial-gradient(circle at 7% 2%, rgba(141, 52, 45, 0.08), transparent 30rem),
    radial-gradient(circle at 92% 16%, rgba(63, 106, 85, 0.08), transparent 34rem),
    linear-gradient(160deg, #f7f4ec 0%, var(--paper) 50%, #ebe4d7 100%);
  background-attachment: fixed;
}

button, input, summary { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(141, 52, 45, 0.28);
  outline-offset: 2px;
}

button:disabled { cursor: not-allowed; opacity: 0.46; }

.app-shell {
  width: min(1460px, calc(100% - 36px));
  margin: 0 auto;
  padding: 30px 0 46px;
}

.site-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  padding: 24px 28px;
  border: 1px solid rgba(184, 173, 152, 0.78);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: rgba(250, 247, 239, 0.84);
  backdrop-filter: blur(12px);
}

.site-header h1 {
  margin: 3px 0 0;
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 1.08;
  letter-spacing: 0.08em;
  font-weight: 700;
}

.eyebrow, .event-type, .activity-category {
  color: var(--accent);
  font-size: 0.73rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.header-actions, .action-row, .debug-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.action-row { margin-top: 20px; }
.action-row.wrap { flex-wrap: wrap; }

.button {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 9px 15px;
  background: transparent;
  cursor: pointer;
  transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  white-space: nowrap;
}

.button:hover:not(:disabled) { transform: translateY(-1px); }
.button.primary {
  color: #fffaf1;
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 7px 18px rgba(141, 52, 45, 0.17);
}
.button.primary:hover:not(:disabled) { background: var(--accent-deep); }
.button.ghost:hover:not(:disabled), .file-label:hover { background: rgba(255, 255, 255, 0.68); border-color: var(--accent); }
.file-label { display: inline-flex; align-items: center; }

.turn-banner {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  border: 1px solid var(--line-strong);
  border-top: 0;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  overflow: hidden;
  background: #2f3532;
  color: #f8f1e5;
  box-shadow: var(--shadow);
}

.turn-banner > div {
  min-width: 0;
  padding: 13px 18px 15px;
  border-right: 1px solid rgba(255, 255, 255, 0.13);
}
.turn-banner > div:last-child { border-right: 0; }
.turn-banner span, .identity-grid span, .finance-grid span, .ending-state-grid span {
  display: block;
  color: inherit;
  opacity: 0.64;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}
.turn-banner strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.97rem; }

.seed-bar {
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  gap: 10px;
  margin: 14px 2px 0;
}
.seed-bar label { color: var(--muted); font-size: 0.78rem; }
.seed-bar input {
  display: block;
  width: min(360px, 65vw);
  margin-top: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 13px;
  color: var(--ink);
  background: rgba(255,255,255,.72);
}

.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 365px;
  gap: 22px;
  align-items: start;
  margin-top: 22px;
}
.main-column, .side-column { display: grid; gap: 18px; min-width: 0; }
.side-column { position: sticky; top: 18px; }

.panel, .narrative-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: 0 10px 30px rgba(55, 46, 34, 0.055);
}
.panel { padding: 22px; }

.panel-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}
.panel-heading h2, .panel h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.28rem;
  letter-spacing: 0.03em;
}
.panel-heading p { margin: 5px 0 0; }

.chip, .counter-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 58%;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 9px;
  color: var(--muted);
  background: rgba(249, 246, 238, 0.76);
  font-size: 0.72rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.counter-chip { min-width: 48px; color: #fff; border-color: var(--accent); background: var(--accent); font-weight: 800; }
.muted { color: var(--muted); font-size: 0.84rem; }

.narrative-card {
  position: relative;
  overflow: hidden;
  padding: 27px 30px 27px 34px;
  color: #f8f0e3;
  background: linear-gradient(125deg, #303633, #3c3c36 58%, #482f2b);
  border-color: rgba(44, 48, 45, 0.8);
}
.narrative-card::before {
  content: "“";
  position: absolute;
  top: -26px;
  right: 16px;
  font-family: var(--serif);
  font-size: 9rem;
  color: rgba(255,255,255,.055);
}
.narrative-card .eyebrow { color: #d9b8a6; }
.narrative-card p { position: relative; margin: 7px 0 0; max-width: 75ch; font-family: var(--serif); font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.9; }

.identity-grid, .finance-grid, .ending-state-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--line);
}
.identity-grid > div, .finance-grid > div, .ending-state-grid > div {
  min-width: 0;
  padding: 13px 15px;
  background: rgba(255, 254, 249, 0.94);
}
.identity-grid strong, .finance-grid strong, .ending-state-grid strong { display: block; font-size: 0.92rem; overflow-wrap: anywhere; }

.cashflow-note {
  margin-top: 13px;
  padding: 11px 14px;
  border-left: 4px solid var(--green);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: #3f5147;
  background: var(--green-soft);
  font-size: 0.84rem;
}

.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.stat-card {
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.7);
}
.stat-card > div:first-child { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stat-card span { color: var(--muted); font-size: 0.76rem; }
.stat-card strong { font-size: 1rem; }
.meter { height: 4px; margin-top: 7px; border-radius: 99px; overflow: hidden; background: #e7e1d5; }
.meter i { display: block; height: 100%; border-radius: inherit; background: #81877f; }
.stat-card.good .meter i { background: var(--green); }
.stat-card.warn .meter i { background: var(--amber); }
.stat-card.danger .meter i { background: var(--danger); }

.selected-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 15px; }
.selected-activity, .empty-slot {
  min-height: 67px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
  padding: 10px 12px;
}
.selected-activity {
  text-align: left;
  cursor: pointer;
  border-style: solid;
  background: var(--accent-soft);
}
.selected-activity span, .selected-activity small { display: block; }
.selected-activity span { font-weight: 700; }
.selected-activity small { margin-top: 3px; color: var(--muted); font-size: .71rem; }
.empty-slot { display: grid; place-items: center; color: #9b958a; background: rgba(247,244,236,.55); font-size: .78rem; }

.category-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.category-tab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 11px;
  background: rgba(255,255,255,.55);
  cursor: pointer;
  color: var(--muted);
  font-size: .78rem;
}
.category-tab.active { color: #fff; background: #424946; border-color: #424946; }

.activity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 7px; }
.activity-card {
  min-height: 144px;
  text-align: left;
  padding: 15px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.64);
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
}
.activity-card:hover { transform: translateY(-2px); border-color: var(--accent); background: #fffdf8; box-shadow: 0 9px 22px rgba(55,46,34,.08); }
.activity-card strong { display: block; margin-top: 3px; font-family: var(--serif); font-size: 1.03rem; }
.activity-card p { margin: 7px 0 8px; color: var(--muted); font-size: .78rem; line-height: 1.55; }
.activity-card small { color: var(--green); font-size: .72rem; }

.event-panel { border-color: #cbb293; background: linear-gradient(145deg, #fffaf0, #f8f0e1); }
.event-panel h2 { margin: 4px 0 8px; font-size: clamp(1.35rem, 3vw, 1.8rem); }
.event-text { margin: 0 0 18px; max-width: 76ch; font-family: var(--serif); font-size: 1rem; line-height: 1.9; }
.event-options { display: grid; gap: 9px; }
.event-choice {
  display: grid;
  grid-template-columns: 40px 1fr;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.73);
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
}
.event-choice:hover { transform: translateX(3px); border-color: var(--accent); background: #fff; }
.event-choice > span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: var(--accent); font-family: var(--serif); font-weight: 700; }
.event-choice strong, .event-choice small { display: block; }
.event-choice small { margin-top: 3px; color: var(--muted); font-size: .75rem; }

.delta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.delta-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: var(--radius-sm); background: rgba(244,241,233,.82); }
.positive { color: var(--green); }
.negative { color: var(--danger); }
.summary-narrative { margin-top: 16px; padding: 17px 19px; border-radius: var(--radius-md); color: #f8f1e6; background: #373d39; font-family: var(--serif); line-height: 1.85; }

.history-list { display: grid; gap: 8px; }
.history-item { padding: 10px 11px; border-left: 3px solid var(--line-strong); background: rgba(247,244,237,.72); }
.history-item > div { display: flex; justify-content: space-between; gap: 8px; }
.history-item > div span, .history-item small { color: var(--muted); font-size: .7rem; }
.history-item p { margin: 3px 0 1px; font-size: .76rem; }

.ending-panel { padding: clamp(24px, 5vw, 45px); border-color: #a99175; background: linear-gradient(148deg, #fffdf6, #f2e8d6); }
.ending-panel > h2 { margin: 5px 0 14px; font-size: clamp(1.7rem, 4vw, 2.7rem); }
.ending-commentary { max-width: 82ch; font-family: var(--serif); font-size: 1.05rem; line-height: 2; }
.ending-tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin: 22px 0; }
.ending-tag { padding: 15px 17px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.66); }
.ending-tag span { color: var(--muted); font-size: .72rem; }
.ending-tag strong { display: block; margin: 3px 0; font-family: var(--serif); color: var(--accent-deep); font-size: 1.05rem; }
.ending-tag p { margin: 0; color: var(--muted); font-size: .76rem; }
.ending-state-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.collection-panel details { margin: 12px 0; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(247,244,236,.7); }
.collection-panel summary { cursor: pointer; font-weight: 700; }
.consent-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; padding: 13px; border-radius: var(--radius-sm); background: var(--amber-soft); font-size: .85rem; }
.consent-row input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.success-note { margin: 15px 0 0; padding: 10px 13px; color: var(--green); background: var(--green-soft); border-radius: var(--radius-sm); }

.debug-panel { margin-top: 22px; background: #242a28; color: #eae8df; border-color: #242a28; }
.debug-panel .chip, .debug-panel .button { color: #eae8df; border-color: #65716b; }
.debug-actions { flex-wrap: wrap; }
.debug-panel pre { max-height: 420px; overflow: auto; margin: 16px 0 0; padding: 15px; border-radius: var(--radius-md); background: #171b1a; color: #c8d6cd; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

footer { padding: 25px 10px 5px; color: var(--muted); text-align: center; font-size: .72rem; letter-spacing: .05em; }

.toast {
  position: fixed;
  z-index: 9999;
  left: 50%;
  bottom: 26px;
  max-width: min(520px, calc(100vw - 32px));
  padding: 11px 17px;
  border-radius: 999px;
  color: #fff;
  background: #333a37;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--amber); }
.toast.error { background: var(--danger); }
.toast.success { background: var(--green); }

.boot-error {
  width: min(700px, calc(100% - 32px));
  margin: 10vh auto;
  padding: 28px;
  border: 1px solid #d0b2aa;
  border-radius: var(--radius-lg);
  background: #fff8f5;
}
.boot-error h1 { font-family: var(--serif); }

@media (max-width: 1050px) {
  .main-grid { grid-template-columns: 1fr; }
  .side-column { position: static; grid-template-columns: 1fr 1fr; }
  .ending-state-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  .app-shell { width: min(100% - 20px, 720px); padding-top: 10px; }
  .site-header { align-items: flex-start; flex-direction: column; padding: 20px; }
  .header-actions { width: 100%; flex-wrap: wrap; }
  .header-actions .button, .header-actions .file-label { flex: 1 1 auto; justify-content: center; text-align: center; }
  .turn-banner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .turn-banner > div { border-bottom: 1px solid rgba(255,255,255,.1); }
  .turn-banner > div:nth-child(even) { border-right: 0; }
  .turn-banner > div:last-child { grid-column: 1 / -1; }
  .seed-bar { align-items: stretch; flex-direction: column; }
  .seed-bar input { width: 100%; }
  .main-grid { margin-top: 14px; }
  .side-column { grid-template-columns: 1fr; }
  .panel { padding: 17px; }
  .narrative-card { padding: 23px 21px; }
  .identity-grid, .finance-grid, .ending-state-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .selected-grid { grid-template-columns: 1fr; }
  .activity-grid { grid-template-columns: 1fr; }
  .activity-card { min-height: 0; }
  .delta-grid, .ending-tags { grid-template-columns: 1fr; }
  .event-choice { grid-template-columns: 35px 1fr; padding: 11px; }
}

@media (max-width: 440px) {
  .site-header h1 { font-size: 2rem; letter-spacing: .04em; }
  .turn-banner { grid-template-columns: 1fr 1fr; }
  .identity-grid, .finance-grid, .ending-state-grid, .stat-grid { grid-template-columns: 1fr; }
  .panel-heading { align-items: flex-start; }
  .chip { max-width: 46%; }
  .action-row .button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

.run-id-note {
  margin: 12px 0;
  padding: 10px 13px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  color: var(--muted);
  background: rgba(255,255,255,.52);
  font-size: .78rem;
  overflow-wrap: anywhere;
}
.run-id-note code { color: var(--ink); font: 0.78rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.run-id-note small { font-size: .7rem; }

.sticky-status { position: sticky; top: 0; z-index: 40; margin: 0 -2px 14px; padding: 10px 12px; background: rgba(31,36,35,.96); color: #fff; border-radius: 0 0 16px 16px; box-shadow: 0 10px 28px rgba(25,25,20,.18); backdrop-filter: blur(12px); }
.status-strip { display:grid; grid-template-columns: repeat(8,minmax(72px,1fr)); gap:8px; }
.status-pill { min-width:0; padding:8px 9px; border:1px solid rgba(255,255,255,.11); border-radius:10px; background:rgba(255,255,255,.055); }
.status-pill span { display:block; color:rgba(255,255,255,.62); font-size:.68rem; }
.status-pill strong { display:block; margin-top:2px; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.status-pill.warn strong { color:#ffd59b; }
.action-progress { display:flex; gap:8px; margin:12px 0 4px; }
.action-progress i { height:6px; flex:1; border-radius:999px; background:var(--paper-deep); }
.action-progress i.done { background:var(--accent); }
.action-progress i.current { background:var(--amber); box-shadow:0 0 0 3px var(--amber-soft); }
.feedback-flash { margin:12px 0; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:#fffdf8; animation: feedbackIn .35s ease-out; }
.feedback-flash h3 { margin:0 0 7px; font-size:1rem; }
.feedback-chips { display:flex; flex-wrap:wrap; gap:7px; }
.feedback-chip { padding:5px 9px; border-radius:999px; font-size:.76rem; background:var(--green-soft); color:var(--green); }
.feedback-chip.neg { background:var(--danger-soft); color:var(--danger); }
.school-brief { padding:18px; border-radius:16px; border:1px solid var(--line); background:linear-gradient(135deg,#fffdf8,#eee6d7); }
.school-brief h2 { margin:4px 0 8px; }
.school-brief-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.school-brief-grid div { padding:10px; border-radius:10px; background:rgba(255,255,255,.7); }
.school-brief-grid span { display:block; font-size:.7rem; color:var(--muted); }
.school-brief-grid strong { font-size:.88rem; }
.family-flow { margin-top:10px; font-size:.8rem; color:var(--muted); }
@keyframes feedbackIn { from { transform:translateY(8px); opacity:0 } to { transform:none; opacity:1 } }
@media (max-width:900px){ .status-strip{grid-template-columns:repeat(4,1fr)} }
@media (max-width:520px){ .sticky-status{margin-left:-10px;margin-right:-10px;border-radius:0 0 14px 14px}.status-strip{grid-template-columns:repeat(2,1fr)}.school-brief-grid{grid-template-columns:1fr}.main-grid{display:block}.side-column{margin-top:14px} }

  </style>
</head>
<body>
  <noscript><div class="boot-error"><h1>需要启用 JavaScript</h1><p>游戏的随机生成、状态机与本地存档都在浏览器中运行。</p></div></noscript>
  <div id="app" aria-live="polite"></div>
  <script>
    /* 将 collectionEndpoint 留空时，结局页只下载匿名数据文件；填入回收地址后才支持最终一次性提交。 */
    window.GAME_CONFIG = {
      collectionEndpoint: "",
      studyId: "alpha-0.1"

"ages":"0-4","factual":"外贸和制造业融入全球市场。","game_effect":"沿海制造、外贸、迁移和父母就业事件权重上升。","source":"D","level":"D"},{"year":2003,"title":"非典与公共卫生冲击","type":"公共卫生","cohorts":"1997-2003","ages":"0-6","factual":"局部教育、出行和家庭经营受冲击。","game_effect":"小概率家庭经营、健康焦虑和照护事件。","source":"D","level":"D"},{"year":2006,"title":"农村义务教育经费保障加强","type":"教育","cohorts":"1997-2003","ages":"3-9","factual":"义务教育公共财政保障逐步扩展。","game_effect":"农村家庭直接学费压力下降，但择校、寄宿、交通和补课差异保留。","source":"D","level":"D"},{"year":2008,"title":"金融危机、汶川地震与奥运年","type":"时代","cohorts":"1997-2003","ages":"5-11","factual":"宏观冲击与国家事件并存。","game_effect":"父母外贸/制造岗位、公益、迁移和心理记忆事件。","source":"D","level":"D"},{"year":2010,"title":"移动互联网普及加速","type":"数字生活","cohorts":"1997-2003","ages":"7-13","factual":"智能手机和社交平台逐步进入家庭与校园。","game_effect":"数字技能、游戏沉迷、信息获取和同伴比较同时上升。","source":"S043","level":"D"},{"year":2014,"title":"新高考改革试点启动","type":"教育","cohorts":"1997-2003","ages":"11-17","factual":"上海、浙江先行，后续省份分批实施。","game_effect":"科目选择、赋分、志愿规则和地区差异事件。","source":"S014","level":"A"},{"year":2015,"title":"高等教育毛入学率40%","type":"教育","cohorts":"1997-2003","ages":"12-18","factual":"高等教育大众化继续推进。","game_effect":"大学机会增加，学校层次和专业匹配的重要性上升。","source":"S009","level":"A"},{"year":2016,"title":"全面两孩政策实施","type":"人口/家庭","cohorts":"1997-2003","ages":"13-19","factual":"家庭可能新增弟妹。","game_effect":"晚出生弟妹、资源稀释、照护义务或家庭联结事件。","source":"S058","level":"D"},{"year":2017,"title":"新高考首批落地与平台经济扩张","type":"教育/就业","cohorts":"1997-2003","ages":"14-20","factual":"浙江、上海首批新高考；平台经济扩张。","game_effect":"志愿复杂度、灵活就业和互联网职业吸引力上升。","source":"S014","level":"D"},{"year":2018,"title":"高考报名人数回升","type":"教育","cohorts":"2000出生者主要高考年","ages":"15-21","factual":"全国高考报名975万人。","game_effect":"同龄升学竞争背景变化。","source":"S017","level":"A"},{"year":2019,"title":"高等教育进入普及化阶段","type":"教育","cohorts":"1997-2003","ages":"16-22","factual":"高等教育毛入学率51.6%。","game_effect":"本科不再自动等于稀缺资格，考研和实习权重上升。","source":"S011","level":"A"},{"year":2020,"title":"新冠疫情、网课和研究生扩招","type":"公共卫生/教育/就业","cohorts":"1997-2003","ages":"17-23","factual":"高考延期，高校线上教学，毕业生874万，硕士扩招18.9万。","game_effect":"实习取消、线上招聘、回家上课、考研缓冲与心理事件。","source":"S019,S021,S060","level":"A"},{"year":2021,"title":"双减、三孩与青年就业口径前夜","type":"教育产业/人口","cohorts":"1997-2003","ages":"18-24","factual":"双减影响教培行业；三孩政策及支持措施出台。","game_effect":"教培职业剧烈转向；本世代自身义务教育不回溯修改。","source":"S057,S058","level":"A"},{"year":2022,"title":"高校毕业生超过千万、职业教育法修订","type":"就业/教育","cohorts":"1997-2003","ages":"19-25","factual":"毕业生1076万；修订职业教育法施行。","game_effect":"学历竞争、技能路线、专升本和职业本科事件权重变化。","source":"S023,S059","level":"A"},{"year":2023,"title":"青年就业压力与生成式AI进入公众视野","type":"就业/技术","cohorts":"1997-2003","ages":"20-26","factual":"旧口径16-24岁青年失业率一度21.3%，统计口径随后调整。","game_effect":"求职延迟、考公考研、AI技能和白领替代风险。","source":"S030,S031","level":"A"},{"year":2024,"title":"延迟退休决定与时间利用调查","type":"养老/家庭","cohorts":"1997-2003","ages":"21-27","factual":"延迟退休自2025年实施；时间调查显示明显的性别无酬劳动差异。","game_effect":"父母退休时间、养老金年限和家庭照护分工进入成年系统。","source":"S033,S054","level":"A"},{"year":2025,"title":"育儿补贴、婚姻登记全国通办与托育扩容","type":"婚育/公共服务","cohorts":"1997-2003","ages":"22-28","factual":"0-3岁补贴制度启动，全国通办，托位数增加。","game_effect":"降低部分制度性成本，但不消除住房、时间和职业中断成本。","source":"S050,S051,S053","level":"A"},{"year":2026,"title":"毕业生规模继续扩大与AI普及","type":"就业/技术","cohorts":"1997-2003","ages":"23-29","factual":"2026届毕业生预计1270万；2025年底生成式AI用户6.02亿。","game_effect":"初入职场竞争、任务重组和技能折旧加快。","source":"S027,S044","level":"A"},{"year":"2027-2038","title":"未来情景卡","type":"情景推演","cohorts":"1997-2003","ages":"24-35","factual":"尚未发生。","game_effect":"从五种情景中抽取隐藏世界状态，并按年度事件表现，不写成确定预言。","source":"E01-E05","level":"E"}],"sources":[{"id":"BASE001","level":"D","title":"用户提供的《分数、关系与出路》原始游戏指令","publisher":"用户提供","year":"2026","url":"","scope":"核心价值、阶段结构、属性、教育和就业框架","note":"设计底稿；资料库保留其现实主义、资本转换、非宿命和多维结局原则。"},{"id":"S001","level":"A","title":"1997年国民经济和社会发展统计公报","publisher":"国家统计局","year":1998,"url":"https://www.stats.gov.cn/sj/tjgb/ndtjgb/qgndtjgb/202302/t20230206_1901941.html","scope":"出生人口、城镇化、城乡收入","note":"1997年出生人口2038万。"},{"id":"S002","level":"A","title":"1998年国民经济和社会发展统计公报"
